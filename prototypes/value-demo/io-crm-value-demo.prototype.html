body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui)}

h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr) 360px;height:100%}

nav.rail{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:16px 10px;gap:2px;overflow:auto}

.rail button:hover{background:var(--nav-on)}
.rail button.on{background:var(--nav-on);box-shadow:inset 3px 0 0 var(--mark)}
[dir="rtl"] .rail button.on{box-shadow:inset -3px 0 0 var(--mark)}
.rail .badge{margin-inline-start:auto;font-size:11px;background:var(--risk);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
.rail .foot{margin-top:auto;padding:12px 10px 0;font-size:11px;color:var(--nav-muted);border-top:1px solid var(--nav-on)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

main{overflow:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 24px}

.viewas{display:flex;align-items:center;gap:8px}
.viewas select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12px}

.screen{padding:24px;display:grid;gap:20px;max-width:1180px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}

.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.item{display:flex;gap:12px;padding:12px 16px;align-items:flex-start}

.empty{padding:20px;text-align:center;color:var(--muted)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}

.funnel{display:grid;gap:8px}
.funnel .f{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:13px}

.tl{list-style:none;margin:0;padding:0;display:grid}

.proof{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.proof li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px}
.proof .tick{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--sunk);color:var(--muted)}

.tour-fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;z-index:20}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:40;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

  .funnel .f{grid-template-columns:110px 1fr 40px}
  .tl li{grid-template-columns:60px 1fr}
  .tl li .sec{display:none}
}
</style>

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  const before = { ...S.done };
  switch (a) {
    case 'go': S.screen = v; S.profileId = null; document.querySelector('main')?.scrollTo(0, 0); break;
    case 'lang': S.lang = v; break;
    case 'task': completeTask(id); break;
    case 'merge': mergeDupes(); break;
    case 'profile': S.profileId = id; if (id === 'p10' && S.merged) S.done.history = true; break;
    case 'close-profile': S.profileId = null; break;
    case 'move': moveStage(id); break;
    case 'quick': S.quickLead = !S.quickLead; break;
    case 'event': S.eventId = id; break;
    case 'capture': S.capture = { tid: id, outcome: null, next: 'Schedule a follow-up call', notes: '' }; break;
    case 'close-capture': S.capture = null; break;
    case 'outcome': S.capture.outcome = v; break;
    case 'online': S.online = !S.online; break;
    case 'save-capture': captureMeeting(S.capture.tid, S.capture); S.capture = null; break;
    case 'sync': S.tasks.forEach(x => x.pending = false); toast('Synced. Everyone in the section can see it now.'); break;
    case 'seg': { const arr = S.seg[el.dataset.k]; const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); S.segSaved = false; break; }
    case 'save-seg': S.segSaved = true; S.done.segment = true; break;
    case 'stake': S.stakeId = id; break;
    case 'stake-close': S.stakeId = null; break;
    case 'stake-cat': S.stakeCat = v; break;
    case 'invite': inviteStakeholder(el.dataset.eid, id); break;
    case 'confirm-part': confirmPart(el.dataset.eid, id); break;
    case 'lead-open': {
      const live = S.events.find(x => x.status === 'Live');
      S.lead = { eid: live ? live.id : 'e2', name: '', poc: '', cc: '', email: '', type: 'Tour operator', interests: [], refer: [], consent: false, scanned: false, err: null };
      S.profileId = null; S.stakeId = null; break;
    }
    case 'lead-close': S.lead = null; break;
    case 'scan': Object.assign(S.lead, SAMPLE_CARD, { scanned: true, err: null }); break;
    case 'lead-int': { const a2 = S.lead.interests, i = a2.indexOf(v); i < 0 ? a2.push(v) : a2.splice(i, 1); break; }
    case 'lead-ref': { const a2 = S.lead.refer, i = a2.indexOf(v); i < 0 ? a2.push(v) : a2.splice(i, 1); break; }
    case 'lead-consent': S.lead.consent = !S.lead.consent; break;
    case 'lead-note': touch(id, `Note added on mobile at ${eventById(S.lead.eid).name}`); toast(`Note added to ${partner(id).name}. No duplicate created.`); S.lead = null; break;
    case 'lead-save':
      if (!S.lead.name.trim()) { S.lead.err = 'Add the company name, or scan a card.'; break; }
      if (findDuplicate(S.lead.name)) { S.lead.err = 'This company already exists. Add a note to the existing record instead.'; break; }
      saveLead(S.lead); S.lead = null; break;
    case 'tour-close': S.tourOpen = false; break;
    case 'tour-open': S.tourOpen = true; break;
    case 'step': S.step = +v; break;
    case 'prev': S.step = Math.max(0, S.step - 1); goStep(); break;
    case 'nextstep': S.step = Math.min(STEPS.length - 1, S.step + 1); goStep(); break;
    case 'show': goStep(true); break;
    case 'restart': location.reload(); return;
    default: return;
  }
  const newly = Object.keys(S.done).find(k => S.done[k] && !before[k]);
  if (newly) advanceIfDone(newly);
  render();
});
function goStep(force) {
  const s = STEPS[S.step]; if (!s.screen) return;
  if (force || S.screen !== s.screen) { S.screen = s.screen; S.profileId = null; S.capture = null; S.stakeId = null; S.lead = null; }
  if (s.ev) S.eventId = s.ev;
  if (s.key === 'report' && S.role === 'layla') spotlight('rolesel'); else spotlight(s.target);
  if (window.matchMedia('(max-width:1100px)').matches && force) S.tourOpen = false;
}
document.addEventListener('change', e => {
  if (e.target.id === 'role') { S.role = e.target.value; if (S.role === 'lead' && !S.done.report) { S.done.report = true; S.screen = 'report'; advanceIfDone('report'); } render(); }
  if (e.target.dataset.bind && S.capture) S.capture[e.target.dataset.bind] = e.target.value;
  // Lead fields: re-render when a field is left, so the duplicate check and activity choice update.
  if (e.target.dataset.lbind === 'eid' && S.lead) { S.lead.eid = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.bind && S.capture) S.capture[e.target.dataset.bind] = e.target.value;
  if (e.target.dataset.lbind && S.lead) {
    S.lead[e.target.dataset.lbind] = e.target.value;
    if (e.target.dataset.lbind === 'name') { const box = document.getElementById('lead-dup'); if (box) box.innerHTML = dupHtml(e.target.value); }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form="lead"]'); if (!f) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f)); const was = S.done.stage; addLead(d); S.quickLead = false;
  toast(`${d.name} added as a Prospect. An intro call was scheduled automatically.`); if (!was) setTimeout(() => toast('Pipeline updated. Press Next in the tour to continue.'), 2700);
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.profileId || S.capture || S.stakeId || S.lead)) { S.profileId = null; S.capture = null; S.stakeId = null; S.lead = null; render(); } });
if (window.matchMedia('(max-width:1100px)').matches) S.tourOpen = true;
render();
</script>
