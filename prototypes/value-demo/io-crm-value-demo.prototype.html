<script>
/* =====================================================================
   0. Seeded sample data. The demo date is fixed so the numbers tell
      one consistent story (IO in October 2026, a recovery year).
   ===================================================================== */
let seed = 20261012;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rint = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const DAY = 864e5;
const TODAY = new Date(2026, 9, 12, 9, 40);
const dAgo = n => new Date(TODAY.getTime() - n * DAY);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function lastReported(c) { let l = -1; c.act.forEach((v, i) => { if (v != null) l = i; }); return l; }
function metrics(c, basis = S.basis) {
  const T = basis === 'st' ? c.tST : c.tC, last = lastReported(c);
  const ytdT = last < 0 ? 0 : sum(T.slice(0, last + 1)), ytdA = sum(c.act);
  return { last, ytdT, ytdA, total: sum(T), ach: ytdT ? ytdA / ytdT : null };
}
// Termination triggers (Conversion-Based Partnership policy), evaluated on contracted targets
function trigger(c) {
  if (c.status !== 'Active') return null;
  const months = []; for (let m = c.s; m <= LAST_M; m++) if (c.act[m] != null && !FM_MONTHS.includes(m)) months.push(m);
  const short = months.map(m => c.act[m] < .8 * c.tC[m]);
  const l = short.length;
  const two = l >= 2 && short[l - 1] && short[l - 2];
  const ach = metrics(c, 'contracted').ach;
  if (two) return { lvl: 'risk', label: 'Trigger: >20% short two months running', next: 'Renegotiate, then termination via Legal' };
  if (ach != null && ach < .8) return { lvl: 'warn', label: 'Tracking below 80% of total target', next: 'Quarterly review: renegotiate' };
  if (ach != null && ach < 1) return { lvl: 'info', label: 'Watch', next: '' };
  return { lvl: 'ok', label: 'On track', next: '' };
}
const isJmpIntl = c => c.market !== 'AE' && c.market !== 'GP';
function guestTotals(list, basis = S.basis, months = null) {
  const res = { jmp: 0, gpI: 0, dom: 0, tJmp: 0, tGp: 0, tDom: 0, spend: 0, nights: 0 };
  list.filter(c => c.status === 'Active' || c.status === 'Ended').forEach(c => {
    const T = basis === 'st' ? c.tST : c.tC, last = lastReported(c);
    c.act.forEach((v, m) => {
      if (months && !months.includes(m)) return; if (v == null) return;
      const t = T[m];
      if (c.market === 'GP') { res.gpI += v * (1 - c.domShare); res.dom += v * c.domShare; res.tGp += t * (1 - c.domShare); res.tDom += t * c.domShare; }
      else if (c.market === 'AE') { res.dom += v; res.tDom += t; }
      else { res.jmp += v; res.tJmp += t; }
      res.spend += Math.min(v, c.tC[m]) * c.cpa; res.nights += v * c.alos;
    });
  });
  res.total = res.jmp + res.gpI + res.dom; res.target = res.tJmp + res.tGp + res.tDom;
  res.cpa = res.total ? res.spend / res.total : 0; res.alos = res.total ? res.nights / res.total : 0;
  return res;
}
function pendingStep(c) { const r = route(c); return c.status === 'Under signature' && c.stage < r.length ? r[c.stage] : null; }
function canAct(c) {

}

    transfers.filter(t => t.status === 'Awaiting Director').forEach(t => items.push({ kind: 'transfer', id: t.id, title: `Budget transfer ${money(t.amount)}`, sub: `${t.from} → ${t.to}`, since: dAgo(2) }));

}

function guestChart(list) {
  const months = [...Array(LAST_M + 1).keys()];
  const rows = months.map(m => { const g = guestTotals(list, S.basis, [m]); return { m, jmp: g.jmp, gp: g.gpI, dom: g.dom, t: g.target }; });
  const max = Math.max(...rows.map(r => Math.max(r.jmp + r.gp + r.dom, r.t))) * 1.1 || 1;
  const W = 680, H = 240, L = 46, B = 26, T = 10, bw = (W - L - 10) / rows.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, .25, .5, .75, 1].map(f => max * f);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly overnight guests against ${basisLabel()}">`;
  ticks.forEach(v => { s += `<line class="grid" x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fK(v)}</text>`; });
  rows.forEach((r, i) => {
    const x = L + i * bw + bw * .2, w = bw * .6; let base = 0;
    [['jmp', 'var(--c-jmp)'], ['gp', 'var(--c-gp)'], ['dom', 'var(--c-dom)']].forEach(([k, col], j) => {
      const v = r[k]; if (v <= 0) return;
      const y1 = y(base + v), y0 = y(base), h = Math.max(y0 - y1 - (j ? 2 : 0), 0);
      s += `<rect x="${x}" y="${y1}" width="${w}" height="${h}" fill="${col}" rx="${j === 2 || (k === 'gp' && !r.dom) ? 3 : 0}"/>`;
      base += v;
    });
    s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${MONTHS[r.m]}</text>`;
  });
  const pts = rows.map((r, i) => `${L + i * bw + bw / 2},${y(r.t)}`).join(' ');
  s += `<polyline points="${pts}" fill="none" stroke="var(--c-target)" stroke-width="2" stroke-dasharray="5 4"/>`;
  rows.forEach((r, i) => { s += `<circle cx="${L + i * bw + bw / 2}" cy="${y(r.t)}" r="4" fill="var(--c-target)" stroke="var(--surface)" stroke-width="2"/>`; });
  rows.forEach((r, i) => {
    const tot = r.jmp + r.gp + r.dom;
    const tip = `<b>${MONTHS[r.m]} 2026</b><br>JMP: ${fN(r.jmp)}<br>GP international: ${fN(r.gp)}<br>Domestic: ${fN(r.dom)}<br>Total: ${fN(tot)} · ${pct(tot / r.t)} of ${basisLabel()}${r.m === LAST_M ? '<br><i>September: some partners still to report</i>' : ''}`;
    s += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  return s + '</svg>';
}

function notifications() {
  const ap = approvals();
  const trig = scoped(contracts).filter(c => (trigger(c) || {}).lvl === 'risk').slice(0, 4);
  const items = [...ap.map(i => ({ t: 'Approval', txt: i.title, act: i.kind === 'transfer' ? 'transfer-open' : 'contract', id: i.id })), ...trig.map(c => ({ t: 'Trigger', txt: `${accountOf(c).name}: >20% short two months running`, act: 'contract', id: c.id })),
    ...scoped(contracts).filter(c => c.pcr === 'Due').map(c => ({ t: 'Due', txt: `Post-completion report: ${c.id}`, act: 'contract', id: c.id }))];
  return items;
}
function topbar() {
  const r = R(), n = notifications();

    <span class="chip mark">Sample data</span>

      ${S.menu === 'notif' ? `<div class="menu"><div class="eyebrow" style="padding:6px 10px">Notifications</div>${n.map(x => `<button class="mi" data-act="${x.act}" data-id="${x.id}"><span class="small"><span class="chip ${x.t === 'Trigger' ? 'risk' : x.t === 'Due' ? 'warn' : 'info'}">${x.t}</span></span><span class="small">${esc(x.txt)}</span></button>`).join('') || '<div class="empty small">Nothing new</div>'}</div>` : ''}</div>

        <div class="eyebrow" style="padding:6px 10px">Switch persona (demo only)</div>${Object.entries(ROLES).map(([k, x]) => `<button class="mi" data-act="as" data-v="${k}"><span class="small"><b>${esc(x.short)}</b>${k === S.role ? ' · current' : ''}</span></button>`).join('')}
        <button class="mi" data-act="signout"><span class="small">Sign out</span></button></div>` : ''}</div></div>`;

function searchResults(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return '';
  const out = [];
  scoped(accounts).concat(accounts.filter(a => a.type === 'Destination stakeholder' && S.role !== 'cm')).forEach(a => { if (a.name.toLowerCase().includes(q)) out.push(['account', a.id, 'Account', a.name]); });
  scoped(contracts).forEach(c => { if (c.id.toLowerCase().includes(q)) out.push(['contract', c.id, 'Contract', `${c.id} · ${accountOf(c).name}`]); });
  if (S.role !== 'cm') tactical.forEach(a => { if ((a.id + a.name).toLowerCase().includes(q) && (R().scope === 'all' || sectionScope().includes(a.section))) out.push(['tactical', a.id, 'Tactical ID', `${a.id} · ${a.name}`]); });
  scoped(events).forEach(e => { if (e.name.toLowerCase().includes(q)) out.push(['event', e.id, 'Event', e.name]); });
  const uniq = out.filter((x, i) => out.findIndex(y => y[1] === x[1]) === i).slice(0, 10);
  return `<div class="results">${uniq.map(([k, id, t, l]) => `<button data-act="${k}" data-id="${id}"><span class="small muted">${t}</span><span>${esc(l)}</span></button>`).join('') || '<div class="empty small">No matches in your access scope</div>'}</div>`;
}
function drawer() {
  const d = S.drawer; if (!d) return '';
  let inner = '';
  if (d.type === 'account') inner = drawerAccount(acct(d.id));
  if (d.type === 'contract') inner = drawerContract(contract(d.id));
  if (d.type === 'tactical') inner = drawerTactical(tactical.find(a => a.id === d.id));
  if (d.type === 'transfer') { const t = transfers.find(x => x.id === d.id); inner = `<div class="row between"><span class="eyebrow">Budget transfer</span><button class="btn ghost sm" data-act="close">Close</button></div><h1 style="font-size:22px">${t.id} · ${money(t.amount)}</h1><div class="facts" style="grid-template-columns:1fr 1fr"><div><span>From</span><b class="small">${t.from}</b></div><div><span>To</span><b class="small">${t.to}</b></div></div><div><h2>Business justification</h2><p class="small">${esc(t.why)}</p></div><div class="small muted">Route: Director approval, then Finance procedures (Oracle).</div>${t.status === 'Awaiting Director' && S.role === 'dir' ? `<button class="btn primary" data-act="approve" data-kind="transfer" data-id="${t.id}">Approve transfer</button>` : `<span class="chip">${t.status}</span>`}`; }
  return `<div class="overlay" data-act="close"></div><aside class="drawer" role="dialog">${inner}</aside>`;
}
function meetSheet() {
  if (S.meet == null) return '';
  const x = meetingsToday[S.meet], a = acct(x.aid);
  return `<div class="overlay" data-act="meet-close"></div><div class="phone" role="dialog" aria-label="Log meeting"><div class="ph-top"><b class="small">LOG MEETING · ${x.time}</b><div style="font-size:18px;font-weight:600;margin-top:6px">${esc(a.name)}</div></div>
    <div class="ph-body"><div class="toggles">${['Positive', 'Neutral', 'Not interested'].map(o => `<button data-act="meet-out" data-v="${o}" class="${S.meetOut === o ? 'on' : ''}">${o}</button>`).join('')}</div>
    <label class="f">Next action<select id="meet-next"><option>Send proposal</option><option>Invite to FAM trip</option><option>Schedule follow-up call</option><option>No follow-up</option></select></label>
    <label class="f">Joint meeting with stakeholder<select id="meet-joint"><option value="">No</option>${events[0].parts.filter(p => p.status === 'Confirmed').map(p => `<option value="${p.sid}">${esc(acct(p.sid).name)}</option>`).join('')}</select></label>
    <label class="f">Notes<textarea id="meet-notes"></textarea></label>

function render() {
  const app = document.getElementById('app');
  if (!S.signedIn) { app.innerHTML = login(); return; }
  if (!navAllowed(S.screen)) S.screen = 'home';
  const main = document.querySelector('main'), y = main ? main.scrollTop : 0;
  const ap = approvals().length;
  app.innerHTML = `<div class="shell ${S.tourOpen ? '' : 'tour-closed'}">
    <nav class="rail"><div class="logo"><b>IO CRM</b><span>DCT International Operations</span></div>
      ${NAV.map(([g, items]) => { const vis = items.filter(([k]) => navAllowed(k)); return vis.length ? `${g ? `<div class="grp">${g}</div>` : ''}${vis.map(([k, l, ic]) => `<button class="${S.screen === k ? 'on' : ''}" data-act="go" data-v="${k}" title="${l}">${icon(ic)}<span class="lbl">${l}</span>${k === 'home' && ap ? `<span class="badge">${ap}</span>` : ''}</button>`).join('')}` : ''; }).join('')}
      <div class="foot">Prototype · sample data<br>Demo date ${fDate(TODAY)}</div></nav>
    <main>${topbar()}<div class="screen">${SCREENS[S.screen]()}</div></main>
    ${S.tourOpen ? tour() : ''}</div>
    ${S.tourOpen ? '' : `<button class="btn primary tour-fab" data-act="tour-open">Guided tour · ${S.step + 1}/${STEPS.length}</button>`}
    ${drawer()}${leadSheet()}${meetSheet()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  const m2 = document.querySelector('main'); if (m2) m2.scrollTop = y;
  if (S.q) { const r = document.getElementById('results'); if (r) r.innerHTML = searchResults(S.q); }
  if (S.spot) { const el = document.querySelector(`[data-spot="${S.spot}"]`); if (el) { el.classList.add('spot'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
}
let tt, stt;
function toast(m) { S.toast = m; clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 2800); }
function done(k, msg) { const was = S.done[k]; S.done[k] = true; toast(msg + (!was && STEPS[S.step].key === k ? ' Press Next in the tour.' : '')); }
function goStep(force) {
  const s = STEPS[S.step]; if (!s.screen) return;
  if (navAllowed(s.screen)) { S.screen = s.screen; if (s.tab) S.tab[s.screen] = s.tab; S.drawer = null; }
  if (s.target) { S.spot = s.target; clearTimeout(stt); stt = setTimeout(() => S.spot = null, 2800); }
  if (force && window.matchMedia('(max-width:1180px)').matches) S.tourOpen = false;
}
function copyText(txt) { try { navigator.clipboard.writeText(txt).then(() => toast('Copied to clipboard.'), () => toast('Copy was blocked here. Select the text instead.')); } catch (e) { toast('Copy was blocked here. Select the text instead.'); } }

/* =====================================================================
   8. Events
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } return; }
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (a !== 'menu') S.menu = null;
  switch (a) {
    case 'sso': S.role = 'uh'; /* fallthrough */
    case 'signin': if (a === 'signin') S.role = v; S.signedIn = true; S.signedAt = new Date(); S.screen = 'home'; log(R().short, 'Signed in', 'Session', 'DCT single sign-on (Microsoft Entra ID, MFA)'); S.done.login = true; break;
    case 'signout': log(R().short, 'Signed out', 'Session', ''); S.signedIn = false; S.drawer = null; break;
    case 'as': log(R().short, 'Signed out', 'Session', 'Persona switch (demo)'); S.role = v; S.signedAt = new Date(); log(R().short, 'Signed in', 'Session', 'DCT single sign-on'); S.drawer = null; toast(`Signed in as ${R().short}. Your view now follows this role's access.`); break;
    case 'menu': S.menu = S.menu === v ? null : v; break;
    case 'go': S.screen = v; S.drawer = null; S.q = ''; if (el.dataset.tab) S.tab[v] = el.dataset.tab; if (id) S.tab.event = id; document.querySelector('main')?.scrollTo(0, 0); break;
    case 'tab': S.tab[el.dataset.k] = v; break;
    case 'basis': S.basis = v; if (S.screen === 'dash' || S.screen === 'home' || S.screen === 'jmp') done('dash', `Now measured against the ${basisLabel()}.`); break;
    case 'account': S.drawer = { type: 'account', id }; S.q = ''; S.logForm = null; break;
    case 'contract': S.drawer = { type: 'contract', id }; S.q = ''; break;
    case 'tactical': S.drawer = { type: 'tactical', id }; S.q = ''; break;
    case 'event': S.screen = 'events'; S.tab.event = id; S.drawer = null; S.q = ''; break;
    case 'transfer-open': S.drawer = { type: 'transfer', id }; break;
    case 'close': S.drawer = null; break;
    case 'merge': S.dupes = false; layla.mergedFrom = true; log(R().short, 'Merged', layla.name, '3 section records merged into one'); done('accounts', '3 records merged into one account.'); break;
    case 'log-open': S.logForm = true; break;
    case 'log-cancel': S.logForm = null; break;
    case 'log-save': {
      const ac = acct(id), kind = document.getElementById('lf-kind').value, txt = document.getElementById('lf-text').value.trim() || `${kind} with ${document.getElementById('lf-contact').value}`;
      ac.activities.unshift({ d: TODAY, kind, by: R().short, text: txt }); log(R().short, 'Logged ' + kind.toLowerCase(), ac.name, txt);
      if (document.getElementById('lf-fu').checked) log('System', 'Created task', ac.name, 'Follow-up in 7 days');
      S.logForm = null; done('accounts', `${kind} logged on ${ac.name}.`); break;
    }
    case 'atp-return': { const l = atp27.find(x => x.id === id); l.status = 'Returned'; log(R().short, 'Returned', l.id, 'Returned to section: ' + ruleFails(l).join('; ')); done('atp', `${l.id} returned to ${l.section} with the failed rules as comments.`); break; }
    case 'jf': S.jmpFilter.status = v; break;
    case 'act-save': {
      const c = contract(id), inp = document.getElementById('act-' + id), val = parseInt(inp && inp.value, 10);
      if (!(val >= 0)) { toast('Enter the number of guests first.'); break; }
      c.act[LAST_M] = val; log(R().short, 'Uploaded actuals', c.id, `September: ${fN(val)} guests`);
      const t = trigger(c); done('actuals', `Saved. ${accountOf(c).name}: ${t ? t.label : ''}. Dashboards updated.`); break;
    }
    case 'import': { scoped(contracts).filter(c => c.status === 'Active' && c.s <= LAST_M && c.act[LAST_M] == null).forEach(c => { c.act[LAST_M] = Math.round(c.tC[LAST_M] * c.perf * (.9 + rnd() * .2)); log(R().short, 'Uploaded actuals', c.id, 'September actuals imported from partner report'); }); done('actuals', 'Partner reports imported. Triggers re-checked and dashboards updated.'); break; }
    case 'approve': {
      const k = el.dataset.kind;
      if (k === 'contract') { const c = contract(id); const step = pendingStep(c)[0]; advance(c); done('approve', `${step.split(' (')[0]} approved for ${c.id}.`); }
      if (k === 'payment') { const c = contract(id); c.pay = 'With Finance'; log(R().short, 'Approved', c.id, 'Payment request approved under DoA; sent to Finance'); done('approve', `Payment for ${c.id} approved and sent to Finance.`); }
      if (k === 'transfer') { const t = transfers.find(x => x.id === id); t.status = 'Approved · with Finance'; log(R().short, 'Approved', t.id, 'Budget transfer approved'); done('approve', `${t.id} approved. Finance procedures start in Oracle.`); S.drawer = null; }
      break;
    }
    case 'sim-step': { const c = contract(id), who = pendingStep(c)[1]; advance(c, who); toast(`${who} step completed (simulated).`); break; }
    case 'doc': { const c = contract(id); c.docs[v] = !c.docs[v]; break; }
    case 'pay-submit': { const c = contract(id); c.pay = 'Awaiting DoA approval'; log(R().short, 'Submitted', c.id, `Payment request ${money(payable(c))} with all documents`); done('pay', 'Payment request sent to the DoA approver.'); break; }
    case 'pcr': { const c = contract(id); c.pcrDoc = true; c.pcr = 'Submitted'; log(R().short, 'Generated', c.id, 'Post-completion report sent to Director'); S.drawer = { type: 'contract', id }; done('pay', 'Post-completion report generated and sent to the Director.'); break; }
    case 'mt-section': S.mtSection = v || null; if (v) done('monitor', `${v}: activity drill-down.`); break;
    case 'prrep': S.tab.prrep = !S.tab.prrep; if (S.tab.prrep) done('prpo', 'Leadership report generated from Oracle data.'); break;
    case 'chase': { const p = prpo.find(x => x.id === id); p.chased = true; log(R().short, 'Chased', p.id, `Reminder sent to owner (${p.age} days)`); toast(`Reminder sent for ${p.id}.`); break; }
    case 'rd': { const r = readiness[id]; r[v] = !r[v]; r.updated = TODAY; log(R().short, 'Updated', MKT[id].name, `${v === 'sell' ? 'Partners can sell' : 'Consumer travel ban'}: ${r[v] ? 'Yes' : 'No'}`); break; }
    case 'du-gen': S.duGen = true; log(R().short, 'Generated', 'Director update', 'Progress / Flagged / Leave'); done('director', 'Director update generated from live data.'); break;
    case 'req-next': { const r = requests[0]; r.stage++; log(R().short, 'Advanced', r.id, r.stages[r.stage]); toast(r.stages[r.stage] + '.'); break; }
    case 'copy': {
      let txt = '';
      if (v === 'du') { const u = directorUpdateText(); txt = Object.entries(u).map(([k, items]) => k + '\n' + items.map(i => '• ' + i).join('\n')).join('\n\n'); }
      if (v === 'prrep') txt = document.querySelector('.doc')?.innerText || '';
      if (v === 'audit') txt = audit.map(x => [fShort(x.t) + ' ' + fTime(x.t), x.u, x.a, x.r, x.d].join('\t')).join('\n');
      copyText(txt); return;
    }
    case 'af': S.auditFilter = v; if (v !== 'All') done('audit', `Showing actions by ${v}.`); break;
    case 'event-sel': break;
    case 'confirm-part': { const ev = events.find(x => x.id === id), p = ev.parts.find(x => x.sid === v); p.status = 'Confirmed'; log(R().short, 'Confirmed', acct(v).name, `${ev.name} · ${p.role}`); done('events', `${acct(v).name} confirmed for ${ev.name}.`); break; }
    case 'meet': S.meet = +v; S.meetOut = null; break;
    case 'meet-close': S.meet = null; break;
    case 'meet-out': S.meetOut = v; break;
    case 'meet-save': {
      const x = meetingsToday[S.meet], ac = acct(x.aid), joint = document.getElementById('meet-joint').value, next = document.getElementById('meet-next').value;
      x.done = true; ac.activities.unshift({ d: TODAY, kind: 'Meeting', by: R().short, text: `Met at ${events[0].name} (${S.meetOut.toLowerCase()})${joint ? ' with ' + acct(joint).name : ''}. Next: ${next}` });
      if (joint) events[0].parts.find(p => p.sid === joint).meetings++;
      log(R().short, 'Logged meeting', ac.name, `${events[0].name} · ${S.meetOut}`); S.meet = null; done('events', `Meeting logged on ${ac.name}. Follow-up created.`); break;
    }
    case 'lead-open': S.lead = { name: '', poc: '', cc: 'DE', email: '', interests: [], refer: [], consent: false }; break;
    case 'lead-close': S.lead = null; break;
    case 'scan': Object.assign(S.lead, { name: 'Rheinland Reisen GmbH', poc: 'Lukas Brandt', cc: 'DE', email: 'l.brandt@rheinland-reisen.example', err: null }); break;
    case 'ld-int': { const i = S.lead.interests.indexOf(v); i < 0 ? S.lead.interests.push(v) : S.lead.interests.splice(i, 1); break; }
    case 'ld-ref': { const i = S.lead.refer.indexOf(v); i < 0 ? S.lead.refer.push(v) : S.lead.refer.splice(i, 1); break; }
    case 'ld-consent': S.lead.consent = !S.lead.consent; break;
    case 'online': S.online = !S.online; break;
    case 'lead-save': {
      const L = S.lead; if (!L.name.trim()) { L.err = 'Add the company name, or scan a card.'; break; }
      if (accounts.find(x => x.name.toLowerCase().split(' ')[0] === L.name.toLowerCase().split(' ')[0])) { L.err = 'This company already exists. Log a meeting on that record instead.'; break; }
      const mk = MKT[(L.cc || 'DE').toUpperCase()] ? (L.cc || 'DE').toUpperCase() : 'DE';
      const ac = addAccount({ id: 'A' + accounts.length, type: 'Trade partner', name: L.name.trim(), market: mk, sub: 'Tour operator', tier: 'Lead' });
      ac.contacts.push({ name: L.poc || '-', role: 'Contact', email: L.email || '-' });
      ac.activities.push({ d: TODAY, kind: 'Meeting', by: R().short, text: `Lead captured on mobile at ${events[0].name}${L.interests.length ? ' · interested in ' + L.interests.join(', ') : ''}` });
      events[0].leads.push({ name: ac.name, poc: L.poc, interests: [...L.interests], refer: [...L.refer], pending: !S.online });
      L.refer.forEach(sid => { const p = events[0].parts.find(x => x.sid === sid); if (p) p.leads++; });
      log(R().short, 'Created lead', ac.name, `Mobile capture at ${events[0].name}${S.online ? '' : ' (offline, queued)'}`);
      S.lead = null; S.screen = 'events'; S.tab.event = 'E1'; done('events', S.online ? 'Lead saved. Intro call scheduled, stakeholders notified.' : 'Lead saved on the phone. It syncs when you reconnect.'); break;
    }
    case 'sync': events.forEach(ev => ev.leads.forEach(l => l.pending = false)); log(R().short, 'Synced', 'Mobile', 'Offline captures synced'); toast('Synced.'); break;
    case 'tour-close': S.tourOpen = false; break;
    case 'tour-open': S.tourOpen = true; break;
    case 'step': S.step = +v; break;
    case 'prev': S.step = Math.max(0, S.step - 1); goStep(); break;
    case 'nextstep': S.step = Math.min(STEPS.length - 1, S.step + 1); goStep(); break;
    case 'show': goStep(true); break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const r = document.getElementById('results'); if (r) r.innerHTML = searchResults(S.q); return; }
  const lb = e.target.dataset.lb;
  if (lb && S.lead) { S.lead[lb] = e.target.value; if (lb === 'name') { const L = S.lead, dup = L.name.length > 3 && accounts.find(a => a.name.toLowerCase().split(' ')[0] === L.name.toLowerCase().split(' ')[0]); document.getElementById('ld-dup').innerHTML = dup ? `<div class="notice mark"><span><b>${esc(dup.name)}</b> already exists. Log a meeting on that record instead of creating a duplicate.</span></div>` : ''; } }
});
document.addEventListener('change', e => {
  const m = e.target.dataset.sig;
  if (m) { const r = readiness[m], old = r.signal; r.signal = e.target.value; r.updated = TODAY; log(R().short, 'Changed signal', MKT[m].name, `${old} → ${r.signal}`); done('market', `${MKT[m].name}: ${old} → ${r.signal}. Activation list and Director update updated.`); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.drawer || S.lead || S.meet != null || S.menu || S.q) { S.drawer = null; S.lead = null; S.meet = null; S.menu = null; S.q = ''; render(); } }
});
// chart tooltips
const tipEl = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tipEl.hidden = true; return; }
  tipEl.innerHTML = t.getAttribute('data-tip'); tipEl.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - 250); tipEl.style.left = x + 'px'; tipEl.style.top = (e.clientY + 14) + 'px';
});
render();
</script>
