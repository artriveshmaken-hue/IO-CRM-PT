<script>
/* =====================================================================
   0. Sample data (fixed seed, fixed demo date)
   ===================================================================== */
let seed = 20261012;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rint = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const DAY = 864e5;
const TODAY = new Date(2026, 9, 12, 9, 40);
const dAgo = n => new Date(TODAY.getTime() - n * DAY);
const dIn = n => new Date(TODAY.getTime() + n * DAY);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const STAGES = ['Prospect', 'Qualified', 'Proposal', 'SI Agreement', 'Active'];
const STAGE_COL = ['#9fb0b8', '#6f9fd3', '#d9a541', '#c9785b', '#2c7a4c'];
const RISK_DAYS = 90;

// IO markets, sections and units (from the IO org structure; context only)

/* ---------- guest performance joined to partner records (JMP Tracker / partner monthly reports, via FR-D1) ---------- */
const SEASON = [1.1, 1.1, 1, .9, .7, .6, .7, .8, .9, 1.1, 1.2, 1.3];
const LAST_M = 8; // actuals reported to September
partners().forEach(p => {
  if (!(p.stage === 'Active' || p.stage === 'SI Agreement')) return;
  const gp = p.market === 'GP', t1 = MKT[p.market].tier === 1;
  const target = gp ? rint(30, 60) * 1000 : t1 ? rint(8, 20) * 1000 : rint(3, 8) * 1000;
  const st = p.stage === 'SI Agreement' ? 9 : 0;
  const w = SEASON.map((x, m) => m >= st ? x : 0), ws = sum(w);
  p.tgt = w.map(x => Math.round(target * x / ws));
  const pf = p.last >= RISK_DAYS ? .5 + rnd() * .3 : p.last > 45 ? .72 + rnd() * .25 : .85 + rnd() * .4;
  p.act = p.tgt.map((t, m) => m <= LAST_M && m >= st ? Math.round(t * pf * (.88 + rnd() * .24)) : null);
  p.cpa = gp ? rint(40, 90) : rint(70, 190); p.alos = +(2.3 + rnd() * 1.8).toFixed(1);
});
const ytd = p => p.act ? { a: sum(p.act), t: sum(p.tgt.slice(0, LAST_M + 1)) } : null;
function perf(list) {
  const ps = list.filter(p => p.act && ytd(p).t > 0);
  const act = sum(ps.map(p => ytd(p).a)), tgt = sum(ps.map(p => ytd(p).t));
  const spend = sum(ps.map(p => Math.min(ytd(p).a, ytd(p).t) * p.cpa)), nights = sum(ps.map(p => ytd(p).a * p.alos));
  const months = [...Array(LAST_M + 1).keys()].map(m => ({ m, a: sum(ps.map(p => p.act[m] || 0)), t: sum(ps.map(p => p.tgt[m])) }));
  return { act, tgt, ach: tgt ? act / tgt : null, cpa: act ? spend / act : 0, alos: act ? nights / act : 0, months, n: ps.length };
}

  rows.forEach((r, i) => {

  });

}

function campPerf() {
  const rows = newsletters.slice().reverse().map(n => ({ label: fShort(n.d), open: Math.round(n.open * 100), click: Math.round(n.click * 100) }));
  const sent = sum(newsletters.map(n => n.sent)), bounce = sum(newsletters.map(n => n.bounce)), unsub = sum(newsletters.map(n => n.unsub));

  { key: 'b', screen: 'campaigns', target: 'segment', title: 'Campaigns with visibility', ref: 'FR-B1 to B3', pain: 'Newsletters go out from Outlook lists with no segments and no engagement tracking. Co-marketing results are not measured.', gain: 'Segments come from partner data and sync to the existing newsletter tool. Engagement and co-marketing return are visible.', task: 'Build a segment and sync it, or open Co-marketing.' },

  { key: 'd', screen: 'dash', tab: 'lead', target: 'pack', role: 'lead', title: 'Leadership view and HQ pack', ref: 'FR-D1 · FR-D2 · NFR 10', pain: 'Leadership has no single view, and the monthly HQ pack is built manually in Excel and PowerPoint.', gain: 'Section leads see their own market; leadership sees all of them. The monthly HQ pack is generated from live data.', task: 'Switch to IO Leadership and generate the HQ pack.' },
  { title: 'What the BRD asks for, shown', ref: 'BRD §2.3 Success criteria', end: true },
];
const KEYS = STEPS.filter(s => s.key).map(s => s.key);
const CRITERIA = [['a1', 'Trade partners migrated into D365 with deduplicated records'], ['a2stage', 'Partner pipeline stages visible live for section leads'], ['c2meet', 'A full event cycle (invitation → attendance → meeting log → follow-up) run in D365'], ['d', 'Monthly HQ reporting pack generated automatically'], ['a3', 'D365 as the sole system of record, with follow-ups no longer in Excel']];
function tour() {
  const st = STEPS[S.step], n = KEYS.filter(k => S.done[k]).length;
  return `<aside class="tour" aria-label="Guided tour"><div class="tour-head"><div class="row between"><span class="eyebrow">Guided tour · ${S.step + 1} of ${STEPS.length}</span><button class="btn ghost sm" data-act="tour-close">Hide</button></div>
    <div class="dots">${STEPS.map((s, i) => `<button aria-label="Step ${i + 1}" data-act="step" data-v="${i}" class="${s.key && S.done[s.key] ? 'ok' : i < S.step ? 'seen' : ''} ${i === S.step ? 'cur' : ''}"></button>`).join('')}</div><div class="small muted">${n} of ${KEYS.length} shown</div></div>
    <div class="tour-body"><div class="ref">${st.ref}</div><h2>${st.title}</h2>
    ${st.end ? `<ul class="proof">${CRITERIA.map(([k, l]) => `<li><span class="tick ${S.done[k] ? 'on' : ''}">${S.done[k] ? '✓' : ''}</span><span>${l}</span></li>`).join('')}</ul><div class="gain"><b>Next</b><span>Run one full event cycle end to end for a pilot market before full rollout, as the success criteria require.</span></div><button class="btn" data-act="go" data-v="brd">See BRD coverage</button>`
    : `<div class="pain"><b>Today</b><span>${st.pain}</span></div><div class="gain"><b>With IO CRM</b><span>${st.gain}</span></div>
      <div class="task ${st.key && S.done[st.key] ? 'ok' : ''}"><span>${st.key && S.done[st.key] ? '✓ Done. ' : ''}${st.task}</span>${st.screen ? `<div class="row wrap"><button class="btn sm" data-act="show">Show me</button>${st.role && st.role !== S.role ? `<button class="btn sm" data-act="as" data-v="${st.role}">Switch to ${ROLES[st.role].name}</button>` : ''}</div>` : ''}</div>`}</div>
    <div class="tour-foot"><button class="btn" data-act="prev" ${S.step === 0 ? 'disabled' : ''}>Back</button><button class="btn primary" data-act="nextstep" ${S.step === STEPS.length - 1 ? 'disabled' : ''}>Next</button></div></aside>`;
}

/* =====================================================================
   6. Shell: sign-in, nav, search, notifications
   ===================================================================== */
const NAV = [['home', 'Home', 'home'], ['m360', 'Market 360', 'map'], ['partners', 'Partners', 'partners'], ['pipeline', 'Pipeline', 'pipeline'], ['followups', 'Follow-ups', 'followups'], ['events', 'Events', 'events'], ['campaigns', 'Campaigns', 'campaigns'], ['dash', 'Dashboards', 'dash'], ['brd', 'BRD coverage', 'brd']];
const SCREENS = { home: screenHome, m360: screenM360, partners: screenPartners, pipeline: screenPipeline, followups: screenFollowups, events: screenEvents, campaigns: screenCampaigns, dash: () => screenDash(false), brd: screenCoverage };
function login() {
  return `<div class="login"><div class="brand"><span class="eyebrow" style="color:var(--nav-muted)">DCT Abu Dhabi · International Operations</span><h1>IO CRM</h1>
    <p>Trade partners, Abu Dhabi stakeholders, pipeline, events and campaigns in one place, for every IO section.</p>
    <ul><li>Microsoft Dynamics 365 Customer Engagement</li><li>Arabic and English, desktop and mobile</li><li>Each section sees its own markets; leadership sees all</li></ul>
    <span class="small" style="color:var(--nav-muted)">Prototype with sample data. Nothing is saved.</span></div>
    <div class="panel"><div class="card"><h2>Sign in</h2>
      <button class="sso" data-act="sso"><svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>Sign in with your DCT account</button>
      <div class="small muted">Single sign-on with your DCT Microsoft account. Your security role decides which records you see.</div>
      <div class="eyebrow" style="margin-top:6px">Demo: choose who to sign in as</div>
      <div style="display:grid;gap:8px">${Object.entries(ROLES).map(([k, r]) => `<button class="persona" data-act="signin" data-v="${k}"><span class="avatar">${r.ini}</span><span><b>${r.name}</b><div class="small muted">${r.title}</div><div class="small muted">${r.desc}</div></span><span class="chip">${k === 'sec' ? 'Start here' : '→'}</span></button>`).join('')}</div></div></div></div>`;
}
function notifications() {
  const od = myTasks().filter(x => !x.done && overdueDays(x) > 0);
  const out = od.filter(x => x.escalated).map(x => ({ t: 'Escalated', txt: `${acct(x.aid).name}: ${x.title}`, act: 'partner', id: x.aid }));
  out.push(...od.filter(x => !x.escalated).slice(0, 5).map(x => ({ t: 'Overdue', txt: `${acct(x.aid).name}: ${x.title}`, act: 'partner', id: x.aid })));
  myEvents().filter(e => e.status === 'Live').forEach(e => out.unshift({ t: 'Live', txt: `${e.name} is running today`, act: 'event', id: e.id }));
  return out;
}
function searchResults(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return '';
  const out = [];
  accounts.filter(a => a.kind === 'stakeholder' || inScope(a.market)).forEach(a => { if (a.name.toLowerCase().includes(q) || a.contacts.some(c => c.name.toLowerCase().includes(q))) out.push(['partner', a.id, a.kind === 'partner' ? 'Partner' : 'Stakeholder', a.name]); });
  myEvents().forEach(e => { if (e.name.toLowerCase().includes(q)) out.push(['event', e.id, 'Event', e.name]); });
  return `<div class="results">${out.slice(0, 10).map(([k, id, tt, l]) => `<button data-act="${k}" data-id="${id}"><span class="small muted">${tt}</span><span>${esc(l)}</span></button>`).join('') || '<div class="empty small">No matches in your access scope</div>'}</div>`;
}
function topbar() {
  const r = R(), n = notifications();
  return `<div class="topbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Search partners, contacts, stakeholders, events" value="${esc(S.q)}" autocomplete="off"><div id="results"></div></div>
    <span class="chip mark">Sample data</span>
    <div class="seg" role="group" aria-label="Language"><button data-act="lang" data-v="en" class="${S.lang === 'en' ? 'on' : ''}">EN</button><button data-act="lang" data-v="ar" class="${S.lang === 'ar' ? 'on' : ''}">عربي</button></div>
    <div class="rel"><button class="iconbtn" data-act="menu" data-v="notif" aria-label="Notifications">${icon('bell')}${n.length ? `<span class="dot">${n.length}</span>` : ''}</button>
      ${S.menu === 'notif' ? `<div class="menu"><div class="eyebrow" style="padding:6px 10px">Notifications</div>${n.map(x => `<button class="mi" data-act="${x.act}" data-id="${x.id}"><span><span class="chip ${x.t === 'Escalated' ? 'risk' : x.t === 'Live' ? 'mark' : 'warn'}">${x.t}</span></span><span class="small">${esc(x.txt)}</span></button>`).join('') || '<div class="empty small">Nothing new</div>'}</div>` : ''}</div>
    <div class="rel"><button class="userchip" data-act="menu" data-v="user"><span class="avatar">${r.ini}</span><span>${esc(r.name)}</span></button>
      ${S.menu === 'user' ? `<div class="menu"><div style="padding:8px 10px"><b>${esc(r.name)}</b><div class="small muted">${r.title}</div><div class="small muted">Signed in ${fTime(S.signedAt)} via DCT single sign-on</div></div>
        <div class="eyebrow" style="padding:6px 10px">Switch persona (demo only)</div>${Object.entries(ROLES).map(([k, x]) => `<button class="mi" data-act="as" data-v="${k}"><span class="small"><b>${esc(x.name)}</b> · ${x.title}${k === S.role ? ' · current' : ''}</span></button>`).join('')}
        <button class="mi" data-act="signout"><span class="small">Sign out</span></button></div>` : ''}</div></div>`;
}
function render() {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  const app = document.getElementById('app');
  if (!S.signedIn) { app.innerHTML = login(); return; }
  const main = document.querySelector('main'), y = main ? main.scrollTop : 0;
  const od = myTasks().filter(x => !x.done && overdueDays(x) > 0).length;
  app.innerHTML = `<div class="shell ${S.tourOpen ? '' : 'tour-closed'}">
    <nav class="rail"><div class="logo"><b>IO CRM</b><span>DCT International Operations</span></div>
      ${NAV.map(([k, l, ic]) => `<button class="${S.screen === k ? 'on' : ''}" data-act="go" data-v="${k}" title="${t(l)}">${icon(ic)}<span class="lbl">${t(l)}</span>${k === 'followups' && od ? `<span class="badge">${od}</span>` : ''}</button>`).join('')}
      <div class="foot">Prototype · sample data<br>Demo date ${fDate(TODAY)}</div></nav>
    <main>${topbar()}<div class="screen">${SCREENS[S.screen]()}</div></main>${S.tourOpen ? tour() : ''}</div>
    ${S.tourOpen ? '' : `<button class="btn primary tour-fab" data-act="tour-open">Guided tour · ${S.step + 1}/${STEPS.length}</button>`}
    ${S.drawer ? `<div class="overlay" data-act="close"></div><aside class="drawer" role="dialog">${drawerPartner(acct(S.drawer))}</aside>` : ''}${leadSheet()}${meetSheet()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  const m2 = document.querySelector('main'); if (m2) m2.scrollTop = y;
  if (S.q) { const r = document.getElementById('results'); if (r) r.innerHTML = searchResults(S.q); }
  if (S.spot) { const el = document.querySelector(`[data-spot="${S.spot}"]`); if (el) { el.classList.add('spot'); el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }
}
let tt, stt;
function toast(m) { S.toast = m; clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 2800); }
function done(k, msg) { const was = S.done[k]; S.done[k] = true; toast(msg + (!was && STEPS[S.step].key === k ? ' Press Next in the tour.' : '')); }
function goStep(force) {
  const s = STEPS[S.step]; if (!s.screen) return;
  S.screen = s.screen; S.drawer = null; if (s.tab) S.tab[s.screen] = s.tab; if (s.ev) S.ev = s.ev;
  if (s.target) { S.spot = s.target; clearTimeout(stt); stt = setTimeout(() => S.spot = null, 2800); }
  if (force && window.matchMedia('(max-width:1180px)').matches) S.tourOpen = false;
}

/* =====================================================================
   7. Events
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } return; }
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (a !== 'menu') S.menu = null;
  switch (a) {
    case 'sso': S.role = 'sec'; S.signedIn = true; S.signedAt = new Date(); break;
    case 'signin': S.role = v; S.sel = null; S.signedIn = true; S.signedAt = new Date(); S.screen = 'home'; break;
    case 'signout': S.signedIn = false; S.drawer = null; break;
    case 'as': S.role = v; S.sel = null; S.signedAt = new Date(); S.drawer = null; toast(`Signed in as ${R().name}. You now see ${R().scope === 'all' ? 'all markets' : R().scope.section ? R().scope.section + ' only' : R().scope.unit + ' only'}.`); break;
    case 'menu': S.menu = S.menu === v ? null : v; break;
    case 'lang': S.lang = v; break;
    case 'go': S.screen = v; S.drawer = null; S.q = ''; document.querySelector('main')?.scrollTo(0, 0); break;
    case 'tab': S.tab[el.dataset.k] = v; if (el.dataset.k === 'camp' && v === 'co') done('b', 'Co-marketing return per partnership.'); break;
    case 'partner': S.drawer = id; S.q = ''; S.logForm = false; if (acct(id).activities.some(x => x.sec !== MKT[acct(id).market]?.section) || acct(id).merged) done('c4', 'History from every IO section in one timeline.'); break;
    case 'close': S.drawer = null; break;
    case 'event': S.screen = 'events'; S.ev = id; S.drawer = null; S.q = ''; break;
    case 'merge': {
      S.dupes = false; dachLead.merged = true; dachLead.last = 40;
      dachLead.activities.push({ d: dAgo(55), sec: 'UK & Americas', kind: 'Call', by: 'UK unit', text: 'Joint promotion discussed' }, { d: dAgo(40), sec: 'Proximity Markets', kind: 'Meeting', by: 'GCC unit', text: 'Stopover programme planning call' });
      dachLead.activities.sort((x, y) => y.d - x.d); hist(dachLead, 'Merged 3 section records into one');
      tasks.filter(x => x.aid === dachLead.id && x.rule === 'R5').forEach(x => x.done = true);
      done('a1', '3 records merged into one. Its re-engagement task closed automatically.'); break;
    }
    case 'log-open': S.logForm = true; break;
    case 'log-cancel': S.logForm = false; break;
    case 'log-save': {
      const ac = acct(id), kind = document.getElementById('lf-kind').value, who = document.getElementById('lf-who').value, txt = document.getElementById('lf-text').value.trim() || `${kind} with ${who}`;
      ac.activities.unshift({ d: TODAY, sec: R().scope.section || 'Europe', kind, by: R().name, text: txt }); ac.last = 0; hist(ac, `Logged ${kind.toLowerCase()}`);
      S.logForm = false; done('c4', `${kind} logged. Every section now sees it.`); break;
    }
    case 'move': { const p = acct(id), i = STAGES.indexOf(p.stage); p.stage = STAGES[i + 1]; p.stages.push({ s: p.stage, at: TODAY }); p.last = 0; hist(p, `Stage moved to ${p.stage}`); done('a2stage', `${p.name} moved to ${p.stage}. Conversion recorded.`); break; }
    case 'task-done': { const x = tasks.find(z => z.id === id); x.done = true; const p = acct(x.aid); p.last = 0; p.activities.unshift({ d: TODAY, sec: MKT[p.market].section, kind: x.kind, by: R().name, text: x.title }); hist(p, `Completed: ${x.title}`); done('a3', `Done: ${x.title}. Logged on ${p.name}.`); break; }
    case 'confirm-part': { const ev = events.find(z => z.id === id), p = ev.parts.find(z => z.sid === v); p.status = 'Confirmed'; hist(acct(v), `Confirmed for ${ev.name}`); done('c2inv', `${acct(v).name} confirmed for ${ev.name}.`); break; }
    case 'meet': S.meet = +v; S.meetOut = null; break;
    case 'meet-close': S.meet = null; break;
    case 'meet-out': S.meetOut = v; break;
    case 'meet-save': {
      const x = stand[S.meet], ac = acct(x.aid), joint = document.getElementById('meet-joint').value, next = document.getElementById('meet-next').value;
      Object.assign(x, { done: true, out: S.meetOut, next, pending: !S.online });
      ac.activities.unshift({ d: TODAY, sec: 'Europe', kind: 'Meeting', by: R().name, text: `Met at ${liveEvent.name} (${S.meetOut.toLowerCase()})${joint ? ' with ' + acct(joint).name : ''}` }); ac.last = 0;
      if (joint) liveEvent.parts.find(p => p.sid === joint).meetings++;
      if (next !== 'No follow-up') addTask({ aid: ac.id, title: next, due: dIn(3), rule: 'R6', kind: 'Follow-up', ev: liveEvent.id });
      liveEvent.invitees.find(z => z.aid === ac.id).attended = true;
      hist(ac, `Meeting logged at ${liveEvent.name}`); S.meet = null;
      done('c2meet', S.online ? 'Meeting saved. Follow-up task created for you.' : 'Saved on the phone. It syncs when you reconnect.'); break;
    }
    case 'online': S.online = !S.online; break;
    case 'sync': stand.forEach(x => x.pending = false); liveEvent.leads.forEach(l => l.pending = false); toast('Synced. The whole section can see it now.'); break;
    case 'lead-open': S.lead = { name: '', poc: '', cc: 'DE', email: '', interests: [], refer: [], consent: false }; S.drawer = null; break;
    case 'lead-close': S.lead = null; break;
    case 'scan': Object.assign(S.lead, { name: 'Rheinland Reisen GmbH', poc: 'Lukas Brandt', cc: 'DE', email: 'l.brandt@rheinland-reisen.example', err: null }); break;
    case 'ld-int': { const i = S.lead.interests.indexOf(v); i < 0 ? S.lead.interests.push(v) : S.lead.interests.splice(i, 1); break; }
    case 'ld-ref': { const i = S.lead.refer.indexOf(v); i < 0 ? S.lead.refer.push(v) : S.lead.refer.splice(i, 1); break; }
    case 'ld-consent': S.lead.consent = !S.lead.consent; break;
    case 'lead-save': {
      const L = S.lead; if (!L.name.trim()) { L.err = 'Add the company name, or scan a card.'; break; }
      if (findDup(L.name)) { L.err = 'This company already exists. Log a meeting on that record instead.'; break; }
      const mk = MKT[(L.cc || '').toUpperCase()] ? L.cc.toUpperCase() : 'DE';
      const p = addAccount({ kind: 'partner', name: L.name.trim(), market: mk, type: 'Tour operator', segment: L.interests[0] || 'Leisure mass', tier: 'Bronze', stage: 'Prospect', last: 0, source: liveEvent.name, contacts: [{ name: L.poc || '-', role: 'Commercial lead', email: L.email || '-' }], stages: [{ s: 'Prospect', at: TODAY }] });
      p.activities.push({ d: TODAY, sec: MKT[mk].section, kind: 'Meeting', by: R().name, text: `Lead captured on mobile at ${liveEvent.name}${L.interests.length ? ' · interested in ' + L.interests.join(', ') : ''}` });
      hist(p, 'Created by mobile lead capture'); addTask({ aid: p.id, title: 'Intro call: qualify interest', due: dIn(2), rule: 'R1', kind: 'Call' });
      liveEvent.leads.push({ name: p.name, poc: L.poc, interests: [...L.interests], refer: [...L.refer], consent: L.consent, pending: !S.online });
      L.refer.forEach(sid => { const pt = liveEvent.parts.find(z => z.sid === sid); if (pt) pt.leads++; });
      S.lead = null; S.screen = 'events'; S.ev = 'E1'; done('a2lead', S.online ? 'Lead saved to the pipeline. Intro call scheduled.' : 'Lead saved on the phone. It syncs when you reconnect.'); break;
    }
    case 'seg': { const arr = S.seg[el.dataset.k], i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); S.segSaved = false; break; }
    case 'seg-save': S.segSaved = true; done('b', 'Segment synced to the newsletter tool.'); break;
    case 'sel': S.sel = v; done('m360', `Showing ${selName(v)}.`); document.querySelector('main')?.scrollTo(0, 0); break;
    case 'insight-task': { const pt = acct(id), y = ytd(pt); pt.insight = true; addTask({ aid: id, title: `Performance review call: ${pct(y.a / y.t)} of target`, due: dIn(1), rule: 'R4', kind: 'Call' }); hist(pt, 'Follow-up created from Market 360 insight'); done('m360', `Follow-up created for ${pt.name}, due tomorrow.`); break; }
    case 'pack': S.pack = true; done('d', 'Monthly HQ pack generated from live data.'); break;
    case 'tour-close': S.tourOpen = false; break;
    case 'tour-open': S.tourOpen = true; break;
    case 'step': S.step = +v; break;
    case 'prev': S.step = Math.max(0, S.step - 1); goStep(); break;
    case 'nextstep': S.step = Math.min(STEPS.length - 1, S.step + 1); goStep(); break;
    case 'show': goStep(true); break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const r = document.getElementById('results'); if (r) r.innerHTML = searchResults(S.q); return; }
  const lb = e.target.dataset.lb;
  if (lb && S.lead) { S.lead[lb] = e.target.value; if (lb === 'name') document.getElementById('ld-dup').innerHTML = dupHtml(e.target.value); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'm360-sel') { S.sel = e.target.value; done('m360', `Showing ${selName(S.sel)}.`); render(); return; }
  const inv = e.target.dataset.inv, f = e.target.dataset.filter;
  if (inv) { const [eid, i] = inv.split(':'), ev = events.find(z => z.id === eid), x = ev.invitees[+i]; x.status = e.target.value; hist(acct(x.aid), `Invitation to ${ev.name}: ${x.status}`); done('c2inv', `${acct(x.aid).name}: ${x.status}.`); render(); }
  if (f) { const [k, field] = f.split(':'); S[k][field] = e.target.value; done('a4', 'Dashboard filtered.'); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.drawer || S.lead || S.meet != null || S.menu || S.q)) { S.drawer = null; S.lead = null; S.meet = null; S.menu = null; S.q = ''; render(); } });
const tipEl = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const tg = e.target.closest && e.target.closest('[data-tip]');
  if (!tg) { tipEl.hidden = true; return; }
  tipEl.innerHTML = tg.getAttribute('data-tip'); tipEl.hidden = false;
  tipEl.style.left = Math.min(e.clientX + 14, window.innerWidth - 250) + 'px'; tipEl.style.top = (e.clientY + 14) + 'px';
});
render();
</script>
