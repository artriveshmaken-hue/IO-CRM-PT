<script>
/* =====================================================================
   0. Sample data (fixed seed, fixed demo date)
   ===================================================================== */
let seed = 20261012;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rint = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const DAY = 864e5;
const TODAY = new Date(2026, 9, 12, 9, 40);
const dAgo = n => new Date(TODAY.getTime() - n * DAY);
const dIn = n => new Date(TODAY.getTime() + n * DAY);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const STAGES = ['Prospect', 'Qualified', 'Proposal', 'SI Agreement', 'Active'];

/* ---------- guest performance joined to partner records (JMP Tracker / partner monthly reports, via FR-D1) ---------- */
const SEASON = [1.1, 1.1, 1, .9, .7, .6, .7, .8, .9, 1.1, 1.2, 1.3];
const LAST_M = 8; // actuals reported to September
partners().forEach(p => {
  if (!(p.stage === 'Active' || p.stage === 'SI Agreement')) return;
  const gp = p.market === 'GP', t1 = MKT[p.market].tier === 1;
  const target = gp ? rint(30, 60) * 1000 : t1 ? rint(8, 20) * 1000 : rint(3, 8) * 1000;
  const st = p.stage === 'SI Agreement' ? 9 : 0;
  const w = SEASON.map((x, m) => m >= st ? x : 0), ws = sum(w);
  p.tgt = w.map(x => Math.round(target * x / ws));
  const pf = p.last >= RISK_DAYS ? .5 + rnd() * .3 : p.last > 45 ? .72 + rnd() * .25 : .85 + rnd() * .4;
  p.act = p.tgt.map((t, m) => m <= LAST_M && m >= st ? Math.round(t * pf * (.88 + rnd() * .24)) : null);
  p.cpa = gp ? rint(40, 90) : rint(70, 190); p.alos = +(2.3 + rnd() * 1.8).toFixed(1);
});
const ytd = p => p.act ? { a: sum(p.act), t: sum(p.tgt.slice(0, LAST_M + 1)) } : null;
function perf(list) {
  const ps = list.filter(p => p.act && ytd(p).t > 0);
  const act = sum(ps.map(p => ytd(p).a)), tgt = sum(ps.map(p => ytd(p).t));
  const spend = sum(ps.map(p => Math.min(ytd(p).a, ytd(p).t) * p.cpa)), nights = sum(ps.map(p => ytd(p).a * p.alos));
  const months = [...Array(LAST_M + 1).keys()].map(m => ({ m, a: sum(ps.map(p => p.act[m] || 0)), t: sum(ps.map(p => p.tgt[m])) }));
  return { act, tgt, ach: tgt ? act / tgt : null, cpa: act ? spend / act : 0, alos: act ? nights / act : 0, months, n: ps.length };
}

/* ---------- Trade promotion (FR-C1 to C4) ---------- */
function evFunnel(e) {
  const conf = e.invitees.filter(x => x.status === 'Confirmed').length, att = e.invitees.filter(x => x.attended).length;
  const fus = tasks.filter(x => x.ev === e.id);
  const steps = e.status === 'Completed'
    ? [['Invited', e.invitees.length], ['Confirmed', conf], ['Attended', att], ['Meetings', e.meetings.length], ['Follow-ups done', `${fus.filter(x => x.done).length}/${fus.length}`], ['Converted', e.meetings.filter(m => m.converted).length]]
    : [['Invited', e.invitees.length], ['Confirmed', conf], ['Stakeholders', e.parts.filter(p => p.status === 'Confirmed').length], ['Meetings logged', stand.filter(x => x.done && e.status === 'Live').length], ['Leads captured', e.leads.length]];
  return `<div class="funnel">${steps.map(([l, v], i) => `<div class="fstep"><span class="small muted">${l}</span><b class="num">${v}</b></div>${i < steps.length - 1 ? '<span class="farrow">›</span>' : ''}`).join('')}</div>`;
}
function evStats(e) {
  const conf = e.invitees.filter(x => x.status === 'Confirmed').length, att = e.invitees.filter(x => x.attended).length;

  return `<div class="row wrap" style="gap:14px;margin-top:4px">${items.map(([v, l]) => `<span class="small"><b class="num" style="font-size:16px">${v}</b> <span class="muted">${l}</span></span>`).join('')}</div>`;
}

function render() {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  const app = document.getElementById('app');
  if (!S.signedIn) { app.innerHTML = login(); return; }
  const main = document.getElementById('main'), y = main ? main.scrollTop : 0;
  const od = myTasks().filter(x => !x.done && overdueDays(x) > 0).length;
  app.innerHTML = `<div class="shell">
    <nav class="rail" aria-label="Main"><div class="logo"><b>IO CRM</b><span>DCT International Operations</span></div>
      ${NAV.map(([g, items]) => `<div class="grp">${t(g)}</div>${items.map(([k, l, ic]) => `<button class="${S.screen === k ? 'on' : ''}" data-act="go" data-v="${k}" title="${t(l)}" aria-current="${S.screen === k ? 'page' : 'false'}">${icon(ic)}<span class="lbl">${t(l)}</span>${k === 'followups' && od ? `<span class="badge">${od}</span>` : ''}</button>`).join('')}`).join('')}
      <div class="foot">Prototype · sample data<br>Demo date ${fDate(TODAY)}</div></nav>
    <main id="main">${topbar()}<div class="sticky">${tourBar()}</div><div class="screen">${SCREENS[S.screen]()}</div></main></div>
    ${leadSheet()}${meetSheet()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  const m2 = document.getElementById('main');
  if (m2) m2.scrollTop = S.scrollTop ? 0 : y;
  S.scrollTop = false;
  if (S.q) { const r = document.getElementById('results'); if (r) r.innerHTML = searchResults(S.q); }
  if (S.spot) { const el = document.querySelector(`[data-spot="${S.spot}"]`); if (el) { el.classList.add('spot'); setTimeout(() => el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 60); } }
}
let tt, stt;
function toast(m) { S.toast = m; clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 3000); }
function done(k, msg) { const was = S.done[k]; S.done[k] = true; toast(msg + (!was && STEPS[S.step].key === k ? ' Press Next ›' : '')); }
function open(screen, view, vtab) { S.screen = screen; S.view = view; S.vtab = vtab || 'overview'; S.q = ''; S.logForm = false; S.scrollTop = true; }

/* =====================================================================
   7. Events
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); } return; }
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (a !== 'menu') S.menu = null;
  switch (a) {
    case 'sso': S.role = 'sec'; S.sel = null; S.signedIn = true; S.signedAt = new Date(); S.screen = 'home'; break;
    case 'signin': S.role = v; S.sel = null; S.signedIn = true; S.signedAt = new Date(); S.screen = 'home'; S.view = null; break;
    case 'signout': S.signedIn = false; S.view = null; break;
    case 'as': S.role = v; S.sel = null; S.signedAt = new Date(); if (S.view && S.view.type !== 'stakeholder') S.view = null; toast(`Signed in as ${R().name}. You now see ${scopeLabel()}.`); break;
    case 'menu': S.menu = S.menu === v ? null : v; break;
    case 'lang': S.lang = v; break;
    case 'go': open(v, null); break;
    case 'back': S.view = null; S.scrollTop = true; break;
    case 'vtab': S.vtab = v; break;
    case 'acttab': S.tab.act = v; break;
    case 'camptab': S.tab.camp = v; if (v === 'co') done('b', 'Co-marketing return per partnership.'); break;
    case 'reptab': S.tab.rep = v; break;
    case 'partner': { const ac = acct(id); open(ac.kind === 'partner' ? 'partners' : 'stakeholders', { type: ac.kind, id }); break; }
    case 'event': open('events', { type: 'event', id }); break;
    case 'pl-stage': S.plist.stage = v; break;
    case 'pl-risk': S.plist.risk = !S.plist.risk; break;
    case 'stake-cat': S.stakeCat = v; break;
    case 'ev-type': S.evType = v; break;
    case 'merge': {
      S.dupes = false; dachLead.merged = true; dachLead.last = 40;
      dachLead.activities.push({ d: dAgo(55), sec: 'UK & Americas', kind: 'Call', by: 'UK unit', text: 'Joint promotion discussed' }, { d: dAgo(40), sec: 'Proximity Markets', kind: 'Meeting', by: 'GCC unit', text: 'Stopover programme planning call' });
      dachLead.activities.sort((x, y) => y.d - x.d); hist(dachLead, 'Merged 3 section records into one');
      tasks.filter(x => x.aid === dachLead.id && x.rule === 'R5').forEach(x => x.done = true);
      done('a1', '3 records merged into one. Its overdue re-engagement task closed.'); break;
    }
    case 'log-open': S.logForm = true; break;
    case 'log-open-tab': S.vtab = 'activity'; S.logForm = true; break;
    case 'log-cancel': S.logForm = false; break;
    case 'log-save': {
      const ac = acct(id), kind = document.getElementById('lf-kind').value, who = document.getElementById('lf-who').value, txt = document.getElementById('lf-text').value.trim() || `${kind} with ${who}`;
      ac.activities.unshift({ d: TODAY, sec: R().scope.section || (ac.market && MKT[ac.market] ? MKT[ac.market].section : 'Europe'), kind, by: R().name, text: txt }); ac.last = 0; hist(ac, `Logged ${kind.toLowerCase()}`);
      S.logForm = false; toast(`${kind} logged. Every section can see it.`); break;
    }
    case 'fu-create': { const ac = acct(id); addTask({ aid: id, title: 'Follow-up call', due: dIn(7), rule: 'R4', kind: 'Call' }); hist(ac, 'Follow-up created'); toast(`Follow-up created for ${ac.name}, due in 7 days.`); break; }
    case 'move': { const p = acct(id), i = STAGES.indexOf(p.stage); p.stage = STAGES[i + 1]; p.stages.push({ s: p.stage, at: TODAY }); p.last = 0; hist(p, `Stage moved to ${p.stage}`); toast(`${p.name} moved to ${p.stage}. Conversion recorded.`); break; }
    case 'task-done': { const x = tasks.find(z => z.id === id); x.done = true; const p = acct(x.aid); p.last = 0; p.activities.unshift({ d: TODAY, sec: MKT[p.market].section, kind: x.kind, by: R().name, text: x.title }); hist(p, `Completed: ${x.title}`); done('a3', `Done: ${x.title} (${p.name}).`); break; }
    case 'confirm-part': { const ev = events.find(z => z.id === id), p = ev.parts.find(z => z.sid === v); p.status = 'Confirmed'; hist(acct(v), `Confirmed for ${ev.name}`); toast(`${acct(v).name} confirmed for ${ev.name}.`); break; }
    case 'meet': S.meet = +v; S.meetOut = null; break;
    case 'meet-close': S.meet = null; break;
    case 'meet-out': S.meetOut = v; break;
    case 'meet-save': {
      const x = stand[S.meet], ac = acct(x.aid), joint = document.getElementById('meet-joint').value, next = document.getElementById('meet-next').value;
      Object.assign(x, { done: true, out: S.meetOut, next, pending: !S.online });
      ac.activities.unshift({ d: TODAY, sec: 'Europe', kind: 'Meeting', by: R().name, text: `Met at ${liveEvent.name} (${S.meetOut.toLowerCase()})${joint ? ' with ' + acct(joint).name : ''}` }); ac.last = 0;
      if (joint) liveEvent.parts.find(p => p.sid === joint).meetings++;
      if (next !== 'No follow-up') addTask({ aid: ac.id, title: next, due: dIn(3), rule: 'R6', kind: 'Follow-up', ev: liveEvent.id });
      const inv = liveEvent.invitees.find(z => z.aid === ac.id); if (inv) inv.attended = true;
      hist(ac, `Meeting logged at ${liveEvent.name}`); S.meet = null;
      done('c2meet', S.online ? 'Meeting saved. Follow-up task created for you.' : 'Saved on the phone. It syncs when you reconnect.'); break;
    }
    case 'online': S.online = !S.online; break;
    case 'sync': stand.forEach(x => x.pending = false); liveEvent.leads.forEach(l => l.pending = false); toast('Synced. The whole section can see it now.'); break;
    case 'lead-open': S.lead = { name: '', poc: '', cc: 'DE', email: '', interests: [], refer: [], consent: false }; break;
    case 'lead-close': S.lead = null; break;
    case 'scan': Object.assign(S.lead, { name: 'Rheinland Reisen GmbH', poc: 'Lukas Brandt', cc: 'DE', email: 'l.brandt@rheinland-reisen.example', err: null }); break;
    case 'ld-int': { const i = S.lead.interests.indexOf(v); i < 0 ? S.lead.interests.push(v) : S.lead.interests.splice(i, 1); break; }
    case 'ld-ref': { const i = S.lead.refer.indexOf(v); i < 0 ? S.lead.refer.push(v) : S.lead.refer.splice(i, 1); break; }
    case 'ld-consent': S.lead.consent = !S.lead.consent; break;
    case 'lead-save': {
      const L = S.lead; if (!L.name.trim()) { L.err = 'Add the company name, or scan a card.'; break; }
      if (findDup(L.name)) { L.err = 'This company already exists. Log a meeting on that record instead.'; break; }
      const mk = MKT[(L.cc || '').toUpperCase()] ? L.cc.toUpperCase() : 'DE';
      const p = addAccount({ kind: 'partner', name: L.name.trim(), market: mk, type: 'Tour operator', segment: L.interests[0] || 'Leisure mass', tier: 'Bronze', stage: 'Prospect', last: 0, source: liveEvent.name, contacts: [{ name: L.poc || '-', role: 'Commercial lead', email: L.email || '-' }], stages: [{ s: 'Prospect', at: TODAY }] });
      p.activities.push({ d: TODAY, sec: MKT[mk].section, kind: 'Meeting', by: R().name, text: `Lead captured on mobile at ${liveEvent.name}${L.interests.length ? ' · interested in ' + L.interests.join(', ') : ''}` });
      hist(p, 'Created by mobile lead capture'); addTask({ aid: p.id, title: 'Intro call: qualify interest', due: dIn(2), rule: 'R1', kind: 'Call' });
      liveEvent.leads.push({ name: p.name, poc: L.poc, interests: [...L.interests], refer: [...L.refer], consent: L.consent, pending: !S.online });
      L.refer.forEach(sid => { const pt = liveEvent.parts.find(z => z.sid === sid); if (pt) pt.leads++; });
      S.lead = null; open('events', { type: 'event', id: 'E1' }, 'meetings');
      done('a2lead', S.online ? 'Lead saved to the pipeline. Intro call scheduled.' : 'Lead saved on the phone. It syncs when you reconnect.'); break;
    }
    case 'seg': { const arr = S.seg[el.dataset.k], i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); S.segSaved = false; break; }
    case 'seg-save': S.segSaved = true; done('b', 'Segment synced to the newsletter tool.'); break;
    case 'pack': S.pack = true; done('d', 'Monthly HQ pack generated from live data.'); break;
    case 'sel': S.sel = v; done('m360', `Showing ${selName(v)}.`); S.scrollTop = true; break;
    case 'insight-task': { const pt = acct(id), y = ytd(pt); pt.insight = true; addTask({ aid: id, title: `Performance review call: ${pct(y.a / y.t)} of target`, due: dIn(1), rule: 'R4', kind: 'Call' }); hist(pt, 'Follow-up created from Market 360'); done('m360', `Follow-up created for ${pt.name}, due tomorrow.`); break; }
    case 'tour-close': S.tourOpen = false; break;
    case 'tour-open': S.tourOpen = true; break;
    case 'why': S.why = !S.why; break;
    case 'step': S.step = +v; goStep(); break;
    case 'prev': S.step = Math.max(0, S.step - 1); goStep(); break;
    case 'nextstep': S.step = Math.min(STEPS.length - 1, S.step + 1); goStep(); break;
    case 'show': goStep(); break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const r = document.getElementById('results'); if (r) r.innerHTML = searchResults(S.q); return; }
  const lb = e.target.dataset.lb;
  if (lb && S.lead) { S.lead[lb] = e.target.value; if (lb === 'name') document.getElementById('ld-dup').innerHTML = dupHtml(e.target.value); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'm360-sel') { S.sel = e.target.value; done('m360', `Showing ${selName(S.sel)}.`); render(); return; }
  const inv = e.target.dataset.inv, f = e.target.dataset.filter;
  if (inv) { const [eid, i] = inv.split(':'), ev = events.find(z => z.id === eid), x = ev.invitees[+i]; x.status = e.target.value; hist(acct(x.aid), `Invitation to ${ev.name}: ${x.status}`); toast(`${acct(x.aid).name}: ${x.status}.`); render(); }
  if (f) { const [k, field] = f.split(':'); S[k][field] = e.target.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.lead || S.meet != null || S.menu || S.q)) { S.lead = null; S.meet = null; S.menu = null; S.q = ''; render(); } });
const tipEl = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const tg = e.target.closest && e.target.closest('[data-tip]');
  if (!tg) { tipEl.hidden = true; return; }
  tipEl.innerHTML = tg.getAttribute('data-tip'); tipEl.hidden = false;
  tipEl.style.left = Math.min(e.clientX + 14, window.innerWidth - 250) + 'px'; tipEl.style.top = (e.clientY + 14) + 'px';
});
render();
</script>
