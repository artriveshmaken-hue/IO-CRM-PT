<!doctype html>
<!--
  PROTOTYPE — throwaway. Not production code.
  Question: what should the IO CRM "Today" home screen look like for a section lead?
  Plan: four structurally different variants of the Today screen for Layla Al Mazrouei (Europe section),
  switchable via ?variant=A|B|C|D and the floating bar at the bottom (or ← / → keys).
  All data is fictional sample data held in memory; nothing is saved. Reload resets everything.
  Grounded in the DCT IO CRM BRD: FR-A2 pipeline stages, FR-A3/C3 auto follow-ups, FR-A4 at-risk (90+ days),
  FR-C2 invitations + mobile meeting capture, FR-C4 cross-IO timeline, NFR 7 Arabic/English, NFR 8 offline capture.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IO CRM Today</title>
<style>
:root{
  --bg:#f6f4f0;--surface:#ffffff;--surface-2:#f1eee8;--ink:#1d1b18;--muted:#6b665e;--line:#e4dfd6;
  --accent:#9a3b2a;--accent-ink:#ffffff;--accent-soft:#f5e4df;
  --ok:#2f7a4f;--ok-soft:#e2f1e7;--warn:#9a5f05;--warn-soft:#f9edd6;--risk:#b42318;--risk-soft:#fbe5e3;
  --info:#2d5f8a;--info-soft:#e3edf6;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --bar:#1d1b18;--bar-ink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513;--surface:#1f1d1a;--surface-2:#282521;--ink:#f1ede6;--muted:#a59e93;--line:#34302a;
  --accent:#e0826f;--accent-ink:#1a1210;--accent-soft:#3a231e;
  --ok:#6cc08f;--ok-soft:#1d3226;--warn:#e3a94a;--warn-soft:#3a2d15;--risk:#f0857a;--risk-soft:#3d1f1c;
  --info:#80b2e0;--info-soft:#1c2c3b;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --bar:#f1ede6;--bar-ink:#161513;
}}
:root[data-theme="dark"]{
  --bg:#161513;--surface:#1f1d1a;--surface-2:#282521;--ink:#f1ede6;--muted:#a59e93;--line:#34302a;
  --accent:#e0826f;--accent-ink:#1a1210;--accent-soft:#3a231e;
  --ok:#6cc08f;--ok-soft:#1d3226;--warn:#e3a94a;--warn-soft:#3a2d15;--risk:#f0857a;--risk-soft:#3d1f1c;
  --info:#80b2e0;--info-soft:#1c2c3b;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --bar:#f1ede6;--bar-ink:#161513;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;padding-bottom:90px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:26px;font-weight:650;letter-spacing:-.01em}
h2{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* shared header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;gap:6px;align-items:baseline}
.brand span{font-weight:400;color:var(--muted)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.sample{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.risk{background:var(--risk-soft);color:var(--risk)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12px}
.seg button.on{background:var(--ink);color:var(--bg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:550}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.lg{padding:10px 16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;align-items:center;gap:10px}
.stack>*+*{margin-top:12px}
.partner{font-weight:600}
.cc{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;letter-spacing:.04em}
form.lead{display:grid;gap:8px}
form.lead label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.toast{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:84px;background:var(--ok);color:#fff;padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);z-index:60;font-weight:550}
[dir="rtl"] .toast{transform:translateX(50%)}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* ---------- Variant A: Day plan ---------- */
.A-hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:24px 0 16px}
.A-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.A-grid{grid-template-columns:1fr}}
.A-block{margin-bottom:20px}
.A-block h2{margin:0 0 8px}
.A-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.A-item:first-child{border-top:0}
.A-item.done .A-title{text-decoration:line-through;color:var(--muted)}
.A-time{width:56px;flex:none;font-variant-numeric:tabular-nums;font-weight:600}
.A-title{font-weight:550}
.A-overdue{border-color:var(--risk-soft)}
.A-overdue .A-time{color:var(--risk)}
.stagebar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:10px 0}
.stagebar i{display:block}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:11px;color:var(--muted)}
.legend b{display:block;font-size:18px;color:var(--ink);font-weight:650}

/* ---------- Variant B: Focus queue ---------- */
.B{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:900px){.B{grid-template-columns:1fr}}
.B-list{max-height:calc(100vh - 170px);overflow:auto}
.B-group{padding:10px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.B-row{display:block;width:100%;text-align:start;border:0;background:transparent;padding:10px 14px;border-inline-start:3px solid transparent}
.B-row:hover{background:var(--surface-2)}
.B-row.sel{background:var(--accent-soft);border-inline-start-color:var(--accent)}
.B-row .muted{font-size:12px}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.B-focus{padding:24px}
.B-focus .kind{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.B-focus .title{font-size:22px;font-weight:650;margin:6px 0 4px}
.B-actions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.B-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:600px){.B-facts{grid-template-columns:repeat(2,1fr)}}
.B-facts div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.B-facts div b{font-weight:600}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:90px 80px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.tl li:first-child{border-top:0}

/* ---------- Variant C: Section cockpit ---------- */
.C-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 16px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.risk b{color:var(--risk)}
.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow-x:auto;margin-top:20px;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;min-height:160px}
.col h3{font-size:13px;display:flex;justify-content:space-between;margin:2px 4px 10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.pcard.risk{border-color:var(--risk);box-shadow:inset 3px 0 0 var(--risk)}
[dir="rtl"] .pcard.risk{box-shadow:inset -3px 0 0 var(--risk)}
.pcard .row{justify-content:space-between}
.C-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;margin-top:20px}
@media (max-width:900px){.C-lower{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-top:0}
td.num{font-variant-numeric:tabular-nums}
.rsvp{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2);min-width:120px}
.rsvp i{display:block}

/* ---------- Variant D: Event mode (mobile) ---------- */
.D{display:flex;gap:32px;justify-content:center;align-items:flex-start;margin-top:24px;flex-wrap:wrap}
.phone{width:390px;max-width:100%;height:780px;max-height:calc(100vh - 130px);min-height:560px;border-radius:36px;border:10px solid #111;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.D-top{background:var(--accent);color:var(--accent-ink);padding:18px 16px 14px}
.D-top .row{justify-content:space-between}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.D-body{flex:1;overflow:auto;padding:12px}
.D-meet{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.D-meet .t{font-weight:700;font-variant-numeric:tabular-nums;width:48px}
.D-sync{padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;font-size:12px}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--surface);border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -10px 30px rgba(0,0,0,.2);max-height:85%;overflow:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-size:13px}
.opts button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.D-note{max-width:320px}
.D-note li{margin-bottom:6px}

/* ---------- Prototype switcher (not part of the design) ---------- */
.proto-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;background:var(--bar);color:var(--bar-ink);border-radius:999px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.3);font:600 13px system-ui,sans-serif;direction:ltr;max-width:calc(100vw - 32px)}
.proto-bar button{background:transparent;border:0;color:inherit;width:34px;height:34px;border-radius:50%;font-size:16px}
.proto-bar button:hover{background:rgba(127,127,127,.25)}
.proto-bar .lbl{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proto-bar .lbl small{opacity:.6;font-weight:500;margin-inline-start:6px}
@media (max-width:600px){h1{font-size:22px}.A-time{width:44px}.A-item{gap:8px;padding:12px 10px}.A-item .btn.ghost{padding:2px 4px;font-size:12px}.phone{border-width:0;border-radius:0;height:auto;max-height:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   Sample data + in-memory state. Fictional partners. Dates are relative
   to "today" so the prototype always looks current.
   ===================================================================== */
const DAY = 864e5;
const NOW = new Date();
const T0 = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
const at = (days, h, m = 0) => {
  const d = new Date(T0.getTime() + days * DAY);
  if (h !== undefined) d.setHours(h, m);
  return d;
};
const STAGES = ['Prospect', 'Qualified', 'Proposal', 'SI Agreement', 'Active'];
const STAGE_COLORS = ['#c9c2b6', '#8fb3d9', '#e3a94a', '#c97a5e', '#2f7a4f'];
const RISK_DAYS = 90;

const P = (id, name, cc, city, type, tier, stage, lastContact, poc, roomNights, history = []) =>
  ({ id, name, cc, city, type, tier, stage, lastContact, poc, roomNights, history });

const state = {
  lang: 'en',
  online: true,
  quickOpen: false,
  focusId: null,
  capture: null,            // { taskId, outcome, next, notes } while the mobile sheet is open
  walkIn: false,
  toast: null,
  partners: [
    P('p1', 'Alpenblick Reisen GmbH', 'DE', 'Munich', 'Tour operator', 'Gold', 'Active', 12, 'Katrin Vogel', 4200, [
      { d: -12, sec: 'Europe', text: 'Paris Roadshow: met at stand, Q1 campaign interest' },
      { d: -40, sec: 'Europe', text: 'Co-marketing campaign reviewed: 2.1k click-throughs' },
      { d: -65, sec: 'GCC', text: 'Hosted on Abu Dhabi product visit' }]),
    P('p2', 'Voyages Lumière', 'FR', 'Paris', 'Luxury agency', 'Gold', 'SI Agreement', 6, 'Julien Marchand', 1800, [
      { d: -6, sec: 'Europe', text: 'SI agreement draft sent for review' },
      { d: -12, sec: 'Europe', text: 'Paris Roadshow: confirmed SI intent' }]),
    P('p3', 'Viaggi Aurora', 'IT', 'Milan', 'Tour operator', 'Silver', 'Proposal', 21, 'Giulia Ferri', 2600, [
      { d: -21, sec: 'Europe', text: 'Proposal sent: summer 2027 allocation' }]),
    P('p4', 'Nordlys Travel AB', 'SE', 'Stockholm', 'OTA', 'Silver', 'Active', 104, 'Erik Lindqvist', 3100, [
      { d: -104, sec: 'Europe', text: 'Quarterly review call' },
      { d: -30, sec: 'APAC', text: 'Contacted by APAC re: Asia stopover packages' }]),
    P('p5', 'Costa Clara Viajes', 'ES', 'Madrid', 'Tour operator', 'Bronze', 'Qualified', 33, 'Lucía Romero', 900),
    P('p6', 'Tulip Way Holidays', 'NL', 'Amsterdam', 'OTA', 'Silver', 'Active', 97, 'Daan de Vries', 2700, [
      { d: -97, sec: 'Europe', text: 'Newsletter opened, no reply to follow-up' }]),
    P('p7', 'Helvetia Luxe Journeys', 'CH', 'Zurich', 'Luxury agency', 'Gold', 'Proposal', 9, 'Martina Keller', 1500, [
      { d: -9, sec: 'Europe', text: 'Nominated 2 agents for winter FAM trip' }]),
    P('p8', 'Danube Select', 'AT', 'Vienna', 'Tour operator', 'Bronze', 'Prospect', 2, 'Felix Huber', 600, [
      { d: -2, sec: 'Europe', text: 'Lead captured on mobile, meeting booked at trade day' }]),
    P('p9', 'Baltic Horizons', 'PL', 'Warsaw', 'Tour operator', 'Bronze', 'Prospect', 15, 'Agnieszka Nowak', 700),
    P('p10', 'Skyline Charter Air', 'DE', 'Frankfurt', 'Airline', 'Gold', 'Active', 128, 'Jonas Weber', 6400, [
      { d: -128, sec: 'Europe', text: 'Charter series wrap-up meeting' },
      { d: -55, sec: 'UK & US', text: 'UK & US section: joint fare promo discussed' },
      { d: -7, sec: 'Europe', text: 'Escalated to Section Head: 120+ days no contact' }]),
    P('p11', 'Belle Époque Voyages', 'BE', 'Brussels', 'Luxury agency', 'Silver', 'Qualified', 41, 'Claire Dubois', 800, [
      { d: -12, sec: 'Europe', text: 'Paris Roadshow: requested luxury product deck' }]),
    P('p12', 'Aegean Blue Tours', 'GR', 'Athens', 'Tour operator', 'Silver', 'Active', 28, 'Nikos Pappas', 1900),
    P('p13', 'Hygge Rejser', 'DK', 'Copenhagen', 'OTA', 'Bronze', 'SI Agreement', 18, 'Mette Hansen', 1200),
    P('p14', 'Lisboa Prime Travel', 'PT', 'Lisbon', 'Tour operator', 'Bronze', 'Qualified', 61, 'Rui Costa', 650),
  ],
  // kind: Meeting | Call | Follow-up | Task. allDay when no time is set.
  tasks: [
    { id: 't11', kind: 'Follow-up', partnerId: 'p10', title: 'Escalated: no contact for 128 days', due: at(-6), source: 'Escalation · Section Head notified' },
    { id: 't1', kind: 'Follow-up', partnerId: 'p4', title: 'Re-engage: check Q4 allocation', due: at(-3), source: 'Engagement cadence · 90-day rule' },
    { id: 't2', kind: 'Call', partnerId: 'p3', title: 'Walk Giulia through proposal pricing', due: at(-1, 15), source: 'Engagement cadence' },
    { id: 't3', kind: 'Meeting', partnerId: 'p1', title: 'Q1 2027 campaign planning', due: at(0, 10), place: 'Stand 212', eventId: 'e4', source: 'Munich Travel Trade Day' },
    { id: 't4', kind: 'Meeting', partnerId: 'p10', title: 'Re-open charter series talks', due: at(0, 11, 30), place: 'Stand 212', eventId: 'e4', source: 'Munich Travel Trade Day' },
    { id: 't5', kind: 'Meeting', partnerId: 'p8', title: 'First meeting: product intro', due: at(0, 14), place: 'Stand 212', eventId: 'e4', source: 'Munich Travel Trade Day' },
    { id: 't6', kind: 'Follow-up', partnerId: 'p11', title: 'Send Abu Dhabi luxury product deck', due: at(0), source: 'Auto-created · Paris Roadshow outcome' },
    { id: 't7', kind: 'Follow-up', partnerId: 'p5', title: 'Share winter-season itineraries', due: at(0), source: 'Auto-created · Paris Roadshow outcome' },
    { id: 't8', kind: 'Call', partnerId: 'p7', title: 'Confirm winter FAM trip nominees', due: at(0, 16, 30), source: 'Engagement cadence' },
    { id: 't12', kind: 'Meeting', partnerId: 'p2', title: 'SI agreement: final clauses', due: at(1, 9, 30), place: 'Teams', source: 'Manual' },
    { id: 't9', kind: 'Follow-up', partnerId: 'p6', title: 'Re-engage: 97 days since last contact', due: at(1), source: 'Engagement cadence · 90-day rule' },
    { id: 't10', kind: 'Call', partnerId: 'p9', title: 'Intro call: qualify interest', due: at(2, 10), source: 'Engagement cadence' },
  ],
  events: [
    { id: 'e4', name: 'Munich Travel Trade Day', type: 'Exhibition', city: 'Munich', start: at(0), end: at(1), status: 'Live', stand: 'Hall B4 · Stand 212', inv: { confirmed: 22, declined: 4, none: 9 } },
    { id: 'e1', name: 'Paris Roadshow', type: 'Roadshow', city: 'Paris', start: at(-12), end: at(-11), status: 'Completed', inv: { confirmed: 28, declined: 6, none: 8 }, meetings: 19, fuDone: 11 },
    { id: 'e2', name: 'Winter FAM trip: luxury agents', type: 'FAM trip', city: 'Abu Dhabi', start: at(9), end: at(14), status: 'Planned', inv: { confirmed: 7, declined: 2, none: 5 } },
    { id: 'e3', name: 'Nordics Roadshow', type: 'Roadshow', city: 'Stockholm · Copenhagen', start: at(23), end: at(25), status: 'Planned', inv: { confirmed: 12, declined: 3, none: 45 } },
  ],
};
state.tasks.forEach(t => { t.allDay = t.due.getHours() === 0 && t.due.getMinutes() === 0; t.done = false; });

/* ---------- Domain helpers (pure over state) ---------- */
const partner = id => state.partners.find(p => p.id === id);
const task = id => state.tasks.find(t => t.id === id);
const endOfToday = at(1);
const isOverdue = t => !t.done && (t.allDay ? t.due < T0 : t.due < T0);
const isToday = t => t.due >= T0 && t.due < endOfToday;
const atRisk = p => p.stage !== 'Prospect' && p.lastContact >= RISK_DAYS;
const openTasks = () => state.tasks.filter(t => !t.done);
const stageCounts = () => STAGES.map(s => state.partners.filter(p => p.stage === s).length);
const nextEvent = () => state.events.filter(e => e.status !== 'Completed').sort((a, b) => a.start - b.start)[0];
const invTotal = e => e.inv.confirmed + e.inv.declined + e.inv.none;

function completeTask(id) {
  const t = task(id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? new Date() : null;
  if (t.done) touchPartner(t.partnerId, `${t.kind} completed: ${t.title}`);
}
function snoozeTask(id) {
  const t = task(id); t.due = new Date(Math.max(t.due.getTime(), T0.getTime()) + DAY);
}
function touchPartner(pid, text) {
  const p = partner(pid); if (!p) return;
  p.lastContact = 0; p.history.unshift({ d: 0, sec: 'Europe', text });
}
function captureMeeting(taskId, { outcome, next, notes }) {
  const t = task(taskId); const p = partner(t.partnerId);
  t.done = true; t.doneAt = new Date(); t.outcome = outcome; t.pendingSync = !state.online;
  touchPartner(p.id, `Meeting logged (${outcome})${notes ? ': ' + notes : ''}`);
  // FR-C3: flagged outcome auto-creates a follow-up with owner + due date
  if (next && next !== 'None') {
    state.tasks.push({ id: 'n' + Date.now(), kind: 'Follow-up', partnerId: p.id, title: next, due: at(3), allDay: true, done: false,
      source: 'Auto-created · ' + (t.source || 'meeting outcome'), pendingSync: !state.online });
  }
  if (outcome === 'Positive' && STAGES.indexOf(p.stage) < 1) p.stage = 'Qualified';
}
function addLead({ name, cc, poc }) {
  const id = 'p' + Date.now();
  state.partners.push(P(id, name, (cc || '??').toUpperCase().slice(0, 2), '', 'Tour operator', 'Bronze', 'Prospect', 0, poc || '-', 0,
    [{ d: 0, sec: 'Europe', text: 'Lead captured via quick-create' }]));
  state.tasks.push({ id: 'q' + Date.now(), kind: 'Call', partnerId: id, title: 'Intro call: qualify interest', due: at(2), allDay: true, done: false,
    source: 'Engagement cadence · new lead', pendingSync: !state.online });
  return id;
}
function advanceStage(pid) {
  const p = partner(pid); const i = STAGES.indexOf(p.stage);
  if (i < STAGES.length - 1) { p.stage = STAGES[i + 1]; touchPartner(pid, 'Stage moved to ' + p.stage); }
}
function syncNow() { state.tasks.forEach(t => t.pendingSync = false); }
const pendingCount = () => state.tasks.filter(t => t.pendingSync).length;

   is standing at a live event. Meetings at the stand, one-tap capture,
   works offline with a visible sync queue (NFR 8, FR-C2, FR-C3).

function renderD() {
  const ev = state.events.find(e => e.status === 'Live');
  const meetings = state.tasks.filter(x => x.eventId === ev.id).sort((a, b) => a.due - b.due);
  const fus = state.tasks.filter(x => !x.done && isToday(x) && !x.eventId);
  const c = state.capture;
  const pend = pendingCount();
  const capTask = c && task(c.taskId);

  return `<main class="wrap"><div class="D">
    <div class="phone">
      <div class="D-top">
        <div class="row"><span class="live">LIVE</span>
          <button class="chip" style="border:0;background:rgba(255,255,255,.2);color:inherit" data-action="online">${state.online ? '● ' + t('Online') : '○ ' + t('Offline')}</button></div>
        <div style="font-size:20px;font-weight:700;margin-top:8px">${esc(ev.name)}</div>
        <div style="opacity:.85;font-size:12px">${esc(ev.stand)} · ${ev.inv.confirmed} confirmed of ${invTotal(ev)}</div>
      </div>
      <div class="D-body">
        <h2 style="margin:6px 4px 8px">${t('Meetings at the stand')}</h2>
        ${meetings.map(m => {
          const p = partner(m.partnerId);
          const status = m.done ? (m.pendingSync ? `<span class="chip warn">${t('Queued')}</span>` : `<span class="chip ok">${t('Logged')}</span>`) : `<span class="chip info">${t('Upcoming')}</span>`;
          return `<button class="D-meet" data-action="${m.done ? '' : 'capture'}" data-id="${m.id}">
            <span class="t">${fmtTime(m.due)}</span>
            <span style="flex:1;min-width:0"><span class="partner" style="display:block">${esc(p.name)}</span><span class="small muted">${esc(m.title)}</span>
            ${atRisk(p) && !m.done ? `<span class="small" style="display:block;color:var(--risk)">⚠ ${p.lastContact} days since last contact</span>` : ''}</span>
            ${status}</button>`;
        }).join('')}
        <button class="btn" style="width:100%;margin:4px 0 16px;padding:12px" data-action="walkin">${t('+ Walk-in contact')}</button>
        ${state.walkIn ? `<div class="card pad" style="margin-bottom:16px">${leadForm('walkin')}</div>` : ''}
        <h2 style="margin:6px 4px 8px">${t('Due today')}</h2>
        ${fus.map(x => `<div class="D-meet" style="cursor:default"><button class="check" data-action="done" data-id="${x.id}" aria-label="Done"></button>
          <span style="flex:1;min-width:0"><span style="display:block;font-weight:550">${esc(x.title)}</span><span class="small muted">${esc(partner(x.partnerId).name)}</span></span></div>`).join('') || `<div class="muted small" style="padding:4px">-</div>`}
      </div>
      <div class="D-sync">
        <span style="flex:1">${pend ? (state.lang === 'ar' ? `${pend} بانتظار المزامنة` : `${pend} change${pend > 1 ? 's' : ''} waiting to sync`) : (state.online ? '✓ All synced' : 'Offline · captures will be queued')}</span>
        <button class="btn small" data-action="sync" ${!pend || !state.online ? 'disabled' : ''}>${t('Sync now')}</button>
      </div>
      ${capTask ? `<div class="sheet-bg" data-action="capture-close"></div><div class="sheet">
        <h3>${t('Capture meeting')}</h3>
        <div class="small muted" style="margin-bottom:12px">${esc(partner(capTask.partnerId).name)} · ${fmtTime(capTask.due)}</div>
        <div class="small muted">${t('Outcome')}</div>
        <div class="opts" style="margin:6px 0 12px">${['Positive', 'Neutral', 'Not interested'].map(o => `<button data-action="outcome" data-v="${o}" class="${c.outcome === o ? 'on' : ''}">${t(o)}</button>`).join('')}</div>
        <label class="small muted">${t('Next action')}
          <select data-bind="next" style="margin-top:4px">${['Send proposal', 'Send product deck', 'Invite to FAM trip', 'Schedule follow-up call', 'None'].map(o => `<option ${c.next === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
        <label class="small muted" style="display:block;margin-top:10px">${t('Notes')}<textarea data-bind="notes" style="margin-top:4px" placeholder="Key points, interest, numbers…">${esc(c.notes)}</textarea></label>
        <div class="small muted" style="margin:8px 0">A follow-up task is created automatically from the next action, owned by you, due in 3 days.</div>
        <div class="row"><button class="btn primary lg" style="flex:1" data-action="capture-save" ${c.outcome ? '' : 'disabled'}>${t('Save')}</button><button class="btn lg" data-action="capture-close">${t('Cancel')}</button></div>
      </div>` : ''}
    </div>
    <div class="D-note">
      <h3 style="margin-bottom:8px">Event mode</h3>
      <p class="muted">What the Today screen becomes when a section rep is at a live event, at phone width.</p>
      <ul class="muted small" style="padding-inline-start:18px">
        <li>Tap a meeting to capture the outcome in under 30 seconds (FR-C2).</li>
        <li>The next action auto-creates a follow-up task (FR-C3).</li>
        <li>Switch to <b>Offline</b> in the header, capture a meeting, and watch it queue; then go back online and sync (NFR 8).</li>
        <li>Walk-in visitors become Prospect leads straight from the stand (FR-A2).</li>
      </ul>
    </div>
  </div></main>`;
}

/* =====================================================================
   Prototype switcher (not part of the design being evaluated)
   ===================================================================== */
const VARIANTS = [
  ['A', 'Day plan', renderA],
  ['B', 'Focus queue', renderB],
  ['C', 'Section cockpit', renderC],
  ['D', 'Event mode (mobile)', renderD],
];
let memVariant = null;
function currentKey() {
  let k = memVariant;
  try { k = new URLSearchParams(location.search).get('variant') || k; } catch (e) {}
  return VARIANTS.some(v => v[0] === k) ? k : 'A';
}
function setVariant(k) {
  memVariant = k;
  try { const u = new URL(location.href); u.searchParams.set('variant', k); history.replaceState(null, '', u); } catch (e) {}
  state.quickOpen = false; state.capture = null; state.walkIn = false;
  render(); window.scrollTo(0, 0);
}
function cycle(dir) {
  const i = VARIANTS.findIndex(v => v[0] === currentKey());
  setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length][0]);
}
function switcher() {
  const v = VARIANTS.find(x => x[0] === currentKey());
  return `<div class="proto-bar" role="toolbar" aria-label="Prototype variant switcher">
    <button data-action="prev" aria-label="Previous variant">←</button>
    <span class="lbl">${v[0]} · ${v[1]}<small>prototype ${VARIANTS.findIndex(x => x === v) + 1}/${VARIANTS.length}</small></span>
    <button data-action="next" aria-label="Next variant">→</button></div>`;
}

/* ---------- render + events ---------- */
function render() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  const v = VARIANTS.find(x => x[0] === currentKey());
  document.getElementById('app').innerHTML = header() + v[2]() + switcher() +
    (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : '');
}
let toastTimer;
function toast(msg) { state.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = null; render(); }, 2200); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch (a) {
    case 'prev': return cycle(-1);
    case 'next': return cycle(1);
    case 'lang': state.lang = el.dataset.v; break;
    case 'done': completeTask(id); if (task(id).done) toast('Logged against ' + partner(task(id).partnerId).name); break;
    case 'snooze': snoozeTask(id); toast('Moved to tomorrow'); break;
    case 'focus': state.focusId = id; break;
    case 'quick': state.quickOpen = !state.quickOpen; break;
    case 'advance': advanceStage(id); toast(partner(id).name + ' → ' + partner(id).stage); break;
    case 'online': state.online = !state.online; break;
    case 'sync': syncNow(); toast('Synced to D365'); break;
    case 'walkin': state.walkIn = true; break;
    case 'walkin-close': state.walkIn = false; break;
    case 'capture': state.capture = { taskId: id, outcome: null, next: 'Schedule follow-up call', notes: '' }; break;
    case 'capture-close': state.capture = null; break;
    case 'outcome': state.capture.outcome = el.dataset.v; break;
    case 'capture-save':
      captureMeeting(state.capture.taskId, state.capture); state.capture = null;
      toast(state.online ? 'Meeting saved + follow-up created' : 'Saved offline, will sync'); break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.bind;
  if (b && state.capture) state.capture[b] = e.target.value;   // no re-render: keeps focus while typing
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form="lead"]'); if (!f) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f));
  addLead(data);
  state.quickOpen = false; state.walkIn = false;
  toast(`${data.name} added as Prospect · intro call scheduled`);
  render();
});
document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || (document.activeElement && document.activeElement.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
</body>
</html>
